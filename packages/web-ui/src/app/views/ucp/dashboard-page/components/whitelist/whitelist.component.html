
<p-table [value]="whitelists" dataKey="id">
    <ng-template #caption>
      <div class="flex justify-between items-center">
        <span>Whitelist Applications</span>
        <p-button label="Add New" icon="pi pi-plus" size="small" (onClick)="addNewWhitelist()"></p-button>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Status</th>
        <th>Grade</th>
        <th>Reviewed By</th>
        <th>Created At</th>
        <th>Updated At</th>
      </tr>
    </ng-template>

    <ng-template #body let-whitelist>
      <tr>
        <td>
          <span
            [ngClass]="{
              'text-yellow-500': whitelist.status === WhitelistStatus.PENDING,
              'text-green-500': whitelist.status === WhitelistStatus.APPROVED,
              'text-red-500': whitelist.status === WhitelistStatus.REJECTED
            }"
          >
            {{ whitelist.status | titlecase }}
          </span>
        </td>
        <td>{{ whitelist.grade ?? '0'}}%</td>
        <td>{{ whitelist.reviewedBy?.username || '-' }}</td>
        <td>{{ whitelist.createdAt | date: 'short' }}</td>
        <td>{{ whitelist.updatedAt | date: 'short' }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7">No whitelist applications found.</td>
      </tr>
    </ng-template>
  </p-table>
