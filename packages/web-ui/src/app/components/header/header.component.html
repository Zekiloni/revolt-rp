<header class="sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-white/5 text-white">
  <div class="container-rr mx-auto h-16 flex items-center gap-6">
    <!-- Logo + ime -->
    <a href="#" class="flex items-center gap-2">
      <img src="/images/logo-1.png" alt="Revolt Roleplay" class="h-8 w-8 rounded" />
      <span class="font-semibold tracking-wide text-white">
        Revolt Roleplay
      </span>
    </a>

    <!-- Desktop nav -->
    <nav class="ml-auto hidden md:flex items-center gap-6">
      <a class="nav-link text-gray-400" href="#">Home</a>
      <a class="nav-link text-gray-400" href="#start">Start Playing</a>
      <a class="nav-link text-gray-400" [href]="forumUrl" target="_blank">Community Forum</a>
      <a class="nav-link text-gray-400" [href]="wikiUrl" target="_blank">Wiki</a>
    </nav>

    <!-- CTA (desktop) -->
    <div class="hidden md:flex items-center gap-3">
      <p-button
        label="Sign In"
        styleClass="btn btn-outline"
        [text]="true"
        (onClick)="openAuth()"
      ></p-button>
    </div>

    <!-- Mobile toggle -->
    <p-button
      icon="pi pi-bars"
      styleClass="ml-auto md:hidden"
      [text]="true"
      (onClick)="toggleMobile()"
      [attr.aria-expanded]="openMobile()"
      aria-controls="mobile-menu"
    ></p-button>
  </div>

  <p-sidebar
    [(visible)]="openMobile"
    position="right"
    styleClass="w-full sm:w-80"
    [modal]="true"
  >
    <ng-template #header>
      <span class="font-semibold text-lg">Menu</span>
    </ng-template>

    <div class="flex flex-col gap-3">
      <a class="nav-link p-3 hover:bg-white/5 rounded" href="#home" (click)="closeMobile()">
        <i class="pi pi-home mr-2"></i> Home
      </a>
      <a class="nav-link p-3 hover:bg-white/5 rounded" href="#start" (click)="closeMobile()">
        <i class="pi pi-play mr-2"></i> Start Playing
      </a>
      <a class="nav-link p-3 hover:bg-white/5 rounded" href="#forum" (click)="closeMobile()">
        <i class="pi pi-users mr-2"></i> Community Forum
      </a>
      <a class="nav-link p-3 hover:bg-white/5 rounded" href="#wiki" (click)="closeMobile()">
        <i class="pi pi-book mr-2"></i> Wiki
      </a>

      <div class="pt-4 flex flex-col gap-2">
        <p-button
          label="Sign In"
          styleClass="w-full"
          [outlined]="true"
          (onClick)="showAuth()"
        ></p-button>
      </div>
    </div>
  </p-sidebar>
</header>


<p-dialog
  [(visible)]="showAuth"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-md overflow-hidden"
  [closable]="false"
  (onHide)="closeAuth()"
