<section id="start" class="relative overflow-hidden">
  <!-- background decorations -->
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <div class="absolute -top-20 left-1/2 -translate-x-1/2 h-72 w-[42rem] rounded-full bg-primary-500/10 blur-3xl"></div>
    <div class="absolute inset-x-0 top-0 h-px bg-white/5"></div>
  </div>

  <div class="relative mx-auto max-w-[1200px] px-6 py-14 md:py-20">
    <!-- heading -->
    <div class="text-center mb-10 md:mb-14">
      <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight">
        How to <span class="text-primary-400">start playing?</span>
      </h2>
      <p class="mt-3 text-sm md:text-base text-gray-400">
        Follow these steps to join the adventure
      </p>
    </div>

    <!-- steps grid -->
    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (s of steps; track s) {
        <a
          [href]="s.cta.href"
          class="
        group relative rounded-2xl bg-neutral-900/60
        p-5 md:p-6
        shadow-[0_20px_60px_rgba(0,0,0,0.35)]
        transition-transform duration-300 hover:-translate-y-1
        focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-500/60
      "
        >
          <div
            class="
          pointer-events-none absolute inset-0 rounded-2xl opacity-0
          transition-opacity duration-300 group-hover:opacity-100
        "
            style="background: radial-gradient(80% 80% at 50% 60%, rgba(234,179,8,0.15), rgba(234,179,8,0) 60%); filter: blur(18px); z-index: -1;"
            aria-hidden="true"
          ></div>

          <div class="absolute inset-0 rounded-2xl ring-0 ring-yellow-500/0 transition-all duration-300 group-hover:ring-1 group-hover:ring-yellow-500/30"></div>

          <div class="mb-4 flex h-8 w-8 items-center justify-center rounded-lg bg-primary-500/15 text-primary-400 font-bold">
            {{ s.n }}
          </div>

          <h3 class="text-lg md:text-xl font-semibold text-white">{{ s.title }}</h3>
          <p class="mt-2 text-sm text-gray-400 leading-relaxed">{{ s.desc }}</p>

          <div class="mt-5">
        <span
          class="
            inline-flex items-center gap-2 rounded-lg border border-white/10
            px-4 py-2 text-sm text-gray-200 mt-auto
            transition-colors duration-200
            group-hover:border-yellow-500/40 group-hover:text-white
          "
        >
          {{ s.cta.label }}
          <i class="pi pi-arrow-right"></i>
        </span>
          </div>
        </a>
      }
    </div>


    <!-- central CTA -->
    <div class="mt-10 md:mt-12 flex justify-center">
      <a [href]="ragempConnectUrl" class="rounded-lg bg-primary-500 px-6 py-3 font-semibold text-black hover:bg-primary-400 transition-colors">
        Connect Now
      </a>
    </div>
  </div>
</section>
