
<form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-12 gap-4 formgrid p-fluid">
  <div class="field mb-6 col-span-12">
    <label for="password" class="text-surface-700 dark:text-surface-100">Password</label>
    <p-password id="password" formControlName="password" [toggleMask]="true" [fluid]="true" [feedback]="true" />
  </div>
  <div class="field mb-6 col-span-12">
    <label for="confirm-password" class="text-surface-700 dark:text-surface-100">Confirm Password</label>
    <p-password id="confirm-password" formControlName="confirmPassword" [toggleMask]="true" [fluid]="true" [feedback]="false" />
  </div>
  <div class="col-span-12 flex justify-end gap-2">
    <p-button
      label="Cancel"
      severity="secondary"
      (onClick)="cancel()"
    />
    <p-button type="submit" label="Save" />
  </div>
</form>
