<section id="home" class="relative min-h-screen overflow-hidden bg-[#0b0c11]">
  <!-- Pozadina -->
  <div
    class="absolute inset-0 bg-surface-60"
    aria-hidden="true"
  ></div>

  <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/40 via-black/20 to-black/60"></div>

  <div class="relative z-10 container mx-auto px-6 min-h-screen flex items-center">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 w-full">
      <!-- LEFT SIDE -->
      <div class="max-w-2xl">
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white">
          <span class="text-yellow-400">Revolt</span> Roleplay
        </h1>

        <p class="mt-4 text-lg text-gray-300 leading-relaxed">
          Los Santos, alive and ruthless. Build your story with a living economy,
          deep factions, and cinematic crime roleplay.
        </p>

        <div class="mt-8 flex flex-wrap gap-3">
          <a
            href="#start"
            class="px-7 py-3 rounded-xl bg-yellow-500 text-black font-semibold hover:bg-yellow-400 transition-colors"
          >Start Playing</a
          >
          <a
            href="#discord"
            class="px-7 py-3 rounded-xl border border-white/15 text-white hover:bg-white/10 transition-colors"
          >Join Discord</a
          >
        </div>

        <!-- Players online -->
        <div class="mt-6 flex items-center gap-4">
          <div class="flex items-center gap-3 rounded-xl border border-white/10 bg-black/30 px-4 py-3 backdrop-blur-md">
            <span
              class="inline-block w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]"
            ></span>
            <div>
              <div class="text-2xl font-bold text-white">1,247</div>
              <div class="text-xs uppercase tracking-wider text-gray-400">
                Players Online
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="relative hidden lg:block">
        <div
          class="relative mx-auto w-full max-w-[700px] aspect-[16/11] translate-y-[-80px]"
        >
          <!-- Elipsa senka -->
          <div
            class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-[74%] h-5 rounded-[50%] bg-black/60 blur-xl"
          ></div>

          <!-- Panels -->
          <div
            class="absolute inset-0 flex items-center justify-center gap-1 z-10"
          >
            <ng-container *ngFor="let i of [].constructor(4); let idx = index">
              <div
                class="relative"
                [ngStyle]="{
                  width: ['27%', '28%', '27%', '19%'][idx],
                  height: heights[idx],
                  transform: 'rotate(' + rotates[idx] + ')',
                  transformOrigin: 'center bottom',
                  opacity: 1,
                  animation: 'splashIn 480ms ease-out forwards',
                  animationDelay: (80 + idx * 120) + 'ms',
                  isolation: 'isolate'
                }"
              >
                <div
                  class="
                    absolute inset-0
                    overflow-hidden bg-transparent
                    shadow-[0_18px_50px_rgba(0,0,0,0.55)]
                    ring-1 ring-white/5
                    transition-transform duration-300 hover:scale-[1.015]
                    filter grayscale hover:grayscale-0 hover:saturate-150 hover:brightness-105
                    will-change-transform
                  "
                  [ngStyle]="{
                    clipPath: shapes[idx],
                    WebkitClipPath: shapes[idx],
                    backgroundImage: 'linear-gradient(to bottom, rgba(0,0,0,0.12), rgba(0,0,0,0) 45%, rgba(0,0,0,0.22) 100%), url(images/hero.jpg)',
                    backgroundRepeat: 'no-repeat, no-repeat',
                    backgroundSize: '100% 100%, ' + (count * 100) + '% 100%',
                    backgroundPosition: 'center, ' + (idx / (count - 1)) * 100 + '% 50%'
                  }"
                ></div>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-black/80 via-black/30 to-transparent"
  ></div>
</section>
