<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="px-8 py-6">
  <!-- Username Field -->
  <div class="mb-5">
    <label for="username" class="block text-white text-sm font-medium mb-2">
      Username
    </label>
    <input
      pInputText
      id="username"
      formControlName="username"
      placeholder="Username"
      class="w-full bg-gray-900/50 border-2 border-primary-400/50 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:border-primary-400 focus:outline-none transition-colors"
    />
  </div>

  <div class="mb-4">
    <label for="password" class="block text-white text-sm font-medium mb-2">
      Password
    </label>
    <input
      type="password"
      pInputText
      id="password"
      formControlName="password"
      placeholder="Password"
      class="w-full bg-gray-900/50 border-2 border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:border-gray-600 focus:outline-none transition-colors"
    />
  </div>

  <div class="flex items-center justify-between mb-6 text-sm">
    <a href="#" class="text-gray-400 hover:text-white transition-colors">
      Forgot password?
    </a>
    <div class="text-gray-400">
      Don't have an account?
      <button class="text-primary-400 hover:text-primary-300 transition-colors ml-1" (click)="switchToRegister()">
        Register
      </button>
    </div>
  </div>

  <button
    type="submit"
    class="w-full bg-primary-400 hover:bg-primary-500 text-black font-semibold py-3 rounded-lg transition-colors mb-4">
    Log in
  </button>

  <p-divider align="center" type="solid" class="mb-6">
    <span class="text-gray-400 px-4">or</span>
  </p-divider>

  <button
    type="button"
    class="w-full bg-gray-800 hover:bg-gray-700 text-white font-semibold py-3 rounded-lg transition-colors flex items-center justify-center gap-2" (click)="onDiscordAuth()">
    <i class="pi pi-discord"></i>
    Log in with Discord
  </button>
</form>
