<div class="absolute-center ml-5 surface-card p-4 shadow-2 border-round w-full lg:w-3 md:w-5">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
    <h2 class="text-lg font-bold mb-2">Inventory</h2>

    <div class="flex flex-wrap gap-2 justify-content-between relative">
      @for (item of inventory; let idx = $index; track idx) {
        <div class="w-5rem h-5rem surface-ground border-round w-full" pDroppable (onDrop)="dragDropItem(idx)">
          @if (item) {
            <div pDraggable
                 (onDragStart)="dragItemStart(item)"
                 (onDragEnd)="dragItemEnd()"
                 (mouseover)="itemInfoPanel.show($event)"
                 (mouseleave)="itemInfoPanel.hide()"
            >
              <h3>{{ item.name }}</h3>
            </div>
          } @else {
            <p>empty </p>
          }
        </div>
      }
    </div>
    <p-overlayPanel #itemInfoPanel [style]="{ width: '350px' }" >
      <ng-template pTemplate="content">
      </ng-template>
    </p-overlayPanel>

  </div>
</div>
