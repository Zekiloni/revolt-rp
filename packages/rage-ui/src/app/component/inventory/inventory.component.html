<div class="absolute-center ml-5 surface-card p-4 shadow-2 border-round w-full lg:w-4 md:w-5" #inventory >
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
    <h2 class="text-lg font-bold mb-2">Inventory</h2>

    <div class="flex flex-wrap gap-4 justify-content-between">
      @if ($inventory | async; as inventory) {
        @for (item of inventory; let idx = $index; track idx) {
          <div class="w-5rem h-5rem surface-ground border-round w-full flex justify-content-center align-items-center"
               appDroppable (dragDrop)="dragDropItem(idx)">
            @if (item) {
              <div
                pBadge
                class="p-overlay-badge"
                severity="info"
                [value]="item.quantity"
                appDraggable
                (dragStart)="dragItemStart(item)"
                (dragEnd)="dragItemEnd($event)"
                (mouseover)="showItemInfoPanel($event, item)"
                (mouseleave)="itemInfoPanel.hide()"
                (contextmenu)="onContextMenu($event, item)"
              >
                <img [ngSrc]="getItemIcon(item.data)" alt="item icon" width="45" height="45">
              </div>
            } @else {
              <i class="pi pi pi-ban text-200"></i>
            }
          </div>
        }
      }
    </div>

    <p-overlayPanel #itemInfoPanel [style]="{ width: '350px' }">
      <ng-template pTemplate="content">
        <div class="flex flex-column">
          <span class="text-900 font-medium text-xl">
            {{ selectedItem!.data.name }}
          </span>
          <p class="text-600">
            {{ selectedItem!.data.description }}
          </p>
        </div>
      </ng-template>
    </p-overlayPanel>

    <p-contextMenu #itemOptionMenu [model]="itemOptionMenuItems" appendTo="body" (onHide)="closeItemOptionMenu()" />
  </div>
</div>
