<div class="field mb-4 flex-auto">
  <label class="font-medium text-900 block" for="target">r{{ 'target_player' | translate }}</label>
  <p-dropdown
    [options]="nearbyPlayers"
    [(ngModel)]="selectedTarget"
    optionLabel="label"
    id="target"
    optionValue="value"
    [filter]="true"
    [emptyFilterMessage]="'no_results' | translate"
    [emptyMessage]="'no_results' | translate"
    appendTo="body"
    (onFilter)="filterNearbyPlayers($event)"
    [placeholder]="'select_player' | translate" />
</div>

<div class="field mb-4 flex-auto">
  <label class="font-medium text-900 block" for="give-quantity">{{ 'quantity' | translate }}</label>
  <p-inputNumber
    [(ngModel)]="inputQuantity"
    [showButtons]="true"
    buttonLayout="horizontal"
    class="mt-1"
    id="give-quantity"
    [step]="1"
    decrementButtonClass="p-button-outlined"
    incrementButtonClass="p-button-outlined"
    incrementButtonIcon="pi pi-plus"
    decrementButtonIcon="pi pi-minus"
  />
</div>

<p-button class="block" [label]="'give_item' | translate" [disabled]="!selectedTarget" (onClick)="submitGive()" />
