<div id="location" class="absolute-bottom-left flex items-center gap-4 ml-8 mb-auto h-[23rem] text-shadow">
  <p class="text-2xl font-bold text-yellow-300 w-12 text-center">{{ headingTo }}</p>
  <div class="flex flex-col">
    <p class="m-0 font-semibold">{{ streetName }}</p>
    <p class="m-0">{{ zoneName }}</p>
  </div>
</div>


@if (speedLimit) {
  <div class="absolute-bottom-center bottom-10">
    <img [src]="getSpeedLimitImage() | staticAsset" alt="speed limit icon" width="55">
  </div>
}

<div class="absolute-top-right flex flex-col items-end text-shadow">
  <div class="flex items-center mr-4 mt-4 gap-3">
    <div class="flex gap-3 items-center py-1 px-3 bg-surface-500/75 rounded-lg">
      <p class="text-surface-100">ID {{ remoteId }}</p>
      <i class="pi pi-user"></i>
    </div>
    <div class="flex gap-3 items-center py-1 px-3 bg-surface-500/75 rounded-lg">
      <p class="text-surface-100">{{ players }}</p>
      <i class="pi pi-users"></i>
    </div>
  </div>
  <div class="flex gap-3 items-center mr-4 mt-4 py-1 px-3 bg-surface-500/75 rounded-lg">
    <p class="text-surface-100">{{ cash | currency }}</p>
    <i class="pi pi-wallet"></i>
  </div>
</div>

@if ($quickSlots | async; as quickSlots) {
  @if ($showQuickSlots | async; ) {
    <div class="absolute-bottom-center flex gap-6 justify-between mb-4" @fadeInOut>
      @for (item of quickSlots; let idx = $index; track idx) {
        <div
          class="w-16 h-16 bg-surface-0 dark:bg-surface-950 rounded-border w-full flex justify-center items-center opacity-40"
          [ngClass]="{ 'opacity-80': item && isItemSelected(item.id) }">
          @if (item) {
            <img [ngSrc]="getItemIcon(item) | staticAsset" imgFallback alt="item icon" width="100" height="100"
                 style="object-fit: contain">
          } @else {
            <i class="pi pi pi-ban text-surface-200 dark:text-surface-600"></i>
          }
        </div>
      }
    </div>
  }
}
