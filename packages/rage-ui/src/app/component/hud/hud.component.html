<div id="location" class="absolute-bottom-left flex align-items-center gap-3 ml-5 mb-auto h-23rem text-shadow">
  <p class="text-2xl font-bold text-yellow-300 w-3rem text-center">{{ headingTo }}</p>
  <div class="flex flex-column">
    <p class="m-0 font-semibold">{{ streetName }}</p>
    <p class="m-0">{{ zoneName }}</p>
  </div>
</div>


@if (speedLimit) {
  <div class="absolute-bottom-center bottom-10">
    <img [src]="getSpeedLimitImage() | staticAsset" alt="speed limit icon" width="55">
  </div>
}

<div class="absolute-top-right flex flex-column text-shadow">
  <h2 class="text-green-500 mr-5">{{ cash | currency }}</h2>
</div>

@if ($quickSlots | async; as quickSlots) {
  <div class="absolute-bottom-center flex gap-4 justify-content-between mb-3">
    @for (item of quickSlots; let idx = $index; track idx) {
      <div
        class="w-4rem h-4rem surface-section border-round w-full flex justify-content-center align-items-center opacity-40"
        [ngClass]="{ 'opacity-80': item && isItemSelected(item.id) }">
        @if (item) {
          <img [ngSrc]="getItemIcon(item.data) | staticAsset" alt="item icon" width="45" height="45">
        } @else {
          <i class="pi pi pi-ban text-200"></i>
        }
      </div>
    }
  </div>
}
