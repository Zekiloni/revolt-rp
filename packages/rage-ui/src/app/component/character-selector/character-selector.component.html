<div class="absolute absolute-center surface-card p-4 shadow-2 border-round w-full lg:w-5">
  <div class="flex justify-content-between align-items-center mb-5">
    <span class="text-xl text-900 font-medium">Characters</span>
  </div>
  @if (characters && characters.length) {
    <ul class="list-none p-0 m-0">
      @for (character of characters; track character.id) {
        <li
          class="flex surface-section flex-column md:flex-row p-3 md:align-items-center md:justify-content-between mb-4 border-2 border-dashed surface-border border-round">
          <div class="flex">
            <div class="mr-0 md:mr-8"><span
              class="block text-900 font-medium mb-1">{{ character.firstName }} {{ character.middleName }} {{ character.lastName }}</span>
              <div class="text-600">Los Santos Sheriff's department</div>
            </div>
          </div>
          <div class="mt-2 md:mt-0 flex flex-nowrap">
            <p-button label="Select" icon="pi pi-play-circle" (onClick)="selectCharacter(character)" />
          </div>
        </li>
      }
    </ul>
  } @else {
    <p class="text-600">You don't have any characters</p>
  }

  <p-button label="Create a Character" icon="pi pi-user-plus"
            (onClick)="createCharacter()"
            [disabled]="characters.length === account.maxCharacters" />
</div>
