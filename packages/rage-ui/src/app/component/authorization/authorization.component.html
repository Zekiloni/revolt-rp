@if (!account) {
  <div class="absolute-left-center ml-5 surface-card p-4 shadow-2 border-round w-full lg:w-3 md:w-5">
    <div class="text-center mb-5">
      <img ngSrc="/assets/images/logo-3.png" alt="Image" class="mb-3" width="115" height="115" [priority]="true">

      <div class="text-900 text-2xl font-medium mb-3">Welcome to <br> Los Santos County Roleplay</div>
      <span class="text-600 font-medium line-height-3">Don't have an account? Create one on</span>
      <a class="block font-medium no-underline ml-2 text-blue-500 cursor-pointer">{{ WEBSITE_URL }}</a>
    </div>

    <form [formGroup]="authForm" (ngSubmit)="submitAuthForm()">
      <label for="username" class="block text-900 font-medium mb-2">Username</label>
      <input id="username" type="text" placeholder="Username" pAutoFocus pInputText class="w-full mb-3"
             formControlName="username">

      <label for="password" class="block text-900 font-medium mb-2">Password</label>
      <input id="password" type="password" placeholder="Password" pInputText class="w-full mb-3"
             formControlName="password">

      <div class="flex align-items-center justify-content-between mb-6">
        <div class="flex align-items-center">
          <p-checkbox id="remember-me" [(ngModel)]="rememberMe" [binary]="true" [ngModelOptions]="{standalone: true}"
                      styleClass="mr-2"></p-checkbox>
          <label for="remember-me">Remember me</label>
        </div>
        <a class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">Forgot password?</a>
      </div>

      <div class="flex flex-column gap-3">
        <button pButton pRipple label="Sign In" icon="pi pi-user" [disabled]="authLoading"></button>
        <button pButton type="button" pRipple severity="secondary" (click)="discordAuthorize()"
                [disabled]="authLoading"
                label="Continue with Discord" icon="pi pi-discord"></button>
      </div>
    </form>
  </div>
} @else {
  <app-character-selector [account]="account" />
}
