@if (!account) {
  <div class="absolute-left-center ml-8 bg-surface-0 dark:bg-surface-900 p-6 shadow rounded-2xl w-full lg:w-3/12 md:w-5/12" @fadeInOut>
    <div class="text-center mb-8">
      <img [ngSrc]="'assets/images/logo-1-x.png' | staticAsset" alt="Image" class="mb-4" width="115" height="115" [priority]="true">
      <div class="text-surface-900 dark:text-surface-0 text-2xl font-medium mb-4">{{ 'welcome_to' | translate: { name: SERVER_NAME } }}</div>
      <span class="text-surface-600 dark:text-surface-200 font-medium leading-normal">{{ 'create_account_hint' | translate }}</span>
    </div>

    <form [formGroup]="authForm" (ngSubmit)="submitAuthForm()">
      <label for="username" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">{{ 'username' | translate }}</label>
      <input id="username" type="text" placeholder="Username" [pAutoFocus]="true" pInputText class="w-full mb-4"
             formControlName="username">

      <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium mb-2">{{ 'password' | translate }}</label>
      <input id="password" type="password" placeholder="Password" pInputText class="w-full mb-4"
             formControlName="password">

      <div class="flex items-center justify-between mb-12">
        <div class="flex items-center">
          <p-checkbox id="remember-me" [(ngModel)]="rememberMe" [binary]="true" [ngModelOptions]="{standalone: true}"
                      styleClass="mr-2"></p-checkbox>
          <label for="remember-me">{{ 'remember_me' | translate }}</label>
        </div>
        <a
          class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">{{ 'forgot_password' | translate }}</a>
      </div>

      <div class="flex flex-col gap-4">
        <button pButton pRipple [label]="'sign_in' | translate" icon="pi pi-user" [disabled]="authLoading"></button>
        <button pButton type="button" pRipple severity="secondary" (click)="discordAuthorize()"
                [disabled]="authLoading"
                [label]="'continue_with_discord' | translate" icon="pi pi-discord"></button>
      </div>
    </form>
  </div>
} @else {
  <app-character-selector [account]="account" @fadeInOut />
}
