@if (!account) {
  <div class="absolute-left-center ml-5 surface-card p-4 shadow-2 border-round w-full lg:w-3 md:w-5">
    <div class="text-center mb-5">
      <img ngSrc="/assets/images/logo-1-x.png" alt="Image" class="mb-3" width="115" height="115" [priority]="true">
      <div class="text-900 text-2xl font-medium mb-3">{{ 'welcome_to' | translate: { name: SERVER_NAME } }}</div>
      <span class="text-600 font-medium line-height-3">{{ 'create_account_hint' | translate }}</span>
    </div>

    <form [formGroup]="authForm" (ngSubmit)="submitAuthForm()">
      <label for="username" class="block text-900 font-medium mb-2">{{ 'username' | translate }}</label>
      <input id="username" type="text" placeholder="Username" pAutoFocus pInputText class="w-full mb-3"
             formControlName="username">

      <label for="password" class="block text-900 font-medium mb-2">{{ 'password' | translate }}</label>
      <input id="password" type="password" placeholder="Password" pInputText class="w-full mb-3"
             formControlName="password">

      <div class="flex align-items-center justify-content-between mb-6">
        <div class="flex align-items-center">
          <p-checkbox id="remember-me" [(ngModel)]="rememberMe" [binary]="true" [ngModelOptions]="{standalone: true}"
                      styleClass="mr-2"></p-checkbox>
          <label for="remember-me">{{ 'remember_me' | translate }}</label>
        </div>
        <a
          class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">{{ 'forgot_password' | translate }}</a>
      </div>

      <div class="flex flex-column gap-3">
        <button pButton pRipple [label]="'sign_in' | translate" icon="pi pi-user" [disabled]="authLoading"></button>
        <button pButton type="button" pRipple severity="secondary" (click)="discordAuthorize()"
                [disabled]="authLoading"
                [label]="'continue_with_discord' | translate" icon="pi pi-discord"></button>
      </div>
    </form>
  </div>
} @else {
  <app-character-selector [account]="account" />
}
