@if (xmrControlsVisible()) {
  <div
    @fadeInOut
    class="mt-4 w-[360px] rounded-2xl
    bg-surface-700/45  shadow
         border border-slate-700
         text-white p-5
         flex flex-col gap-4">

    <!-- HEADER -->
    <div class="text-center">
      <p class="text-xs tracking-widest uppercase"
         [ngClass]="radioOn() ? 'text-blue-400' : 'text-slate-500'">

        {{ radioOn() ? 'now_playing' : 'xmr_off' }}
      </p>

      <p class="text-lg font-semibold">
        {{ radioOn() ? radioStationName() : '—' }}
      </p>

      <p class="text-sm text-slate-400 italic">
        {{ radioOn() ? radioStationGenre() : '' }}
      </p>
    </div>

    <!-- CONTROLS -->
    <div class="flex items-center justify-between">

      <!-- PREV -->
      <button
        [disabled]="!radioOn"
        (click)="previousStation()"
        class="w-12 h-12 rounded-full bg-slate-800
             hover:bg-slate-700 flex items-center justify-center">
        <i class="pi pi-step-backward"></i>
      </button>

      <!-- PLAY / PAUSE -->
      <button
        (click)="toggleXmr()"
        class="w-16 h-16 rounded-full bg-blue-500
             hover:bg-blue-400 flex items-center justify-center
             shadow-lg">
        <i class="pi pi-power-off text-xl"></i>
      </button>

      <!-- NEXT -->
      <button
        [disabled]="!radioOn"
        (click)="nextStation()"
        class="w-12 h-12 rounded-full bg-slate-800
             hover:bg-slate-700 flex items-center justify-center">
        <i class="pi pi-step-forward"></i>
      </button>
    </div>

    <!-- VOLUME -->
    <div class="flex items-center gap-3">
      <i class="pi pi-volume-down text-slate-400"></i>
      <input
        type="range"
        min="0"
        max="100"
        [disabled]="!radioOn"
        [ngModel]="radioVolume"
        (ngModelChange)="onVolumeChange($event)"
        class="flex-1 accent-blue-500" />
      <span class="text-sm text-slate-400">
      {{ radioVolume() }}%
    </span>
    </div>
  </div>

}
