<div class="absolute-bottom-right mr-5 mb-5 text-shadow flex flex-column">
  <div class="card flex flex-column align-items-center gap-3">
    <p-knob [(ngModel)]="speed" [strokeWidth]="10" size="145" [max]="maxSpeed" valueTemplate="{value}"
            [valueColor]="speedValueColor" [readonly]="true" styleClass="font-italic" />
    <p class="-mt-8">km/h</p>
  </div>

  <div class="flex flex-row justify-content-between gap-2 mt-4">
    <div class="flex align-items-center gap-2">
      <span>{{ fuel }}%</span>
      <i class="pi pi-gauge"></i>
    </div>
    <div class="flex align-items-center gap-2">
      <span>{{ mileage.toFixed(2) }}km</span>
      <i class="pi pi-car"></i>
    </div>

    <div class="flex align-items-center gap-2">
      <span>{{ gear }}</span>
      <i class="pi pi-cog"></i>
      <span>{{ rpm }}</span>
    </div>
  </div>
</div>
