<div class="absolute-bottom-right mr-8 mb-8 text-shadow flex flex-col w-[520px] text-white">

  <app-vehicle-xmr />

  @switch (type) {

    <!-- ✈️ FLY MODE -->
    @case ('fly') {
      <div class="flex justify-between items-center mt-4 text-sm text-gray-300">

        <!-- SPEED -->
        <div class="flex flex-col">
      <span class="text-5xl font-bold text-white leading-none">
        {{ speed.toFixed(0) }}
      </span>
          <span class="text-xs tracking-widest">KMH</span>
        </div>

        <!-- HEIGHT -->
        <div class="flex items-center gap-1">
          <span>{{ height.toFixed(1) }} m</span>
          <i class="pi pi-arrows-v"></i>
        </div>

        <!-- PITCH & ROLL -->
        <div class="flex flex-col gap-2 w-48">

          <!-- PITCH -->
          <div class="flex items-center gap-2">
        <span class="w-10 text-right text-xs">
          {{ pitch.toFixed(0) }}°
        </span>

            <div class="relative w-full h-1 bg-gray-700 rounded">
              <!-- center -->
              <div class="absolute left-1/2 top-0 h-full w-px bg-gray-400"></div>

              <!-- value -->
              <div
                class="absolute top-0 h-full bg-cyan-400 transition-all"
                [style.left.%]="pitch < 0 ? 50 + (pitch / 90) * 50 : 50"
                [style.width.%]="Math.abs(pitch) / 90 * 50">
              </div>
            </div>

            <span class="text-xs">P</span>
          </div>

          <!-- ROLL -->
          <div class="flex items-center gap-2">
        <span class="w-10 text-right text-xs">
          {{ roll.toFixed(0) }}°
        </span>

            <div class="relative w-full h-1 bg-gray-700 rounded">
              <!-- center -->
              <div class="absolute left-1/2 top-0 h-full w-px bg-gray-400"></div>

              <!-- value -->
              <div
                class="absolute top-0 h-full bg-orange-400 transition-all"
                [style.left.%]="roll < 0 ? 50 + (roll / 90) * 50 : 50"
                [style.width.%]="Math.abs(roll) / 90 * 50">
              </div>
            </div>

            <span class="text-xs">R</span>
          </div>

        </div>
      </div>
    }


    <!-- 🌊 WATER MODE -->
    @case ('water') {
      <div class="flex items-end gap-3 mt-4">
        <span class="text-6xl font-extrabold leading-none">
          {{ speed.toFixed(0) }}
        </span>
        <span class="text-lg text-gray-300 mb-2">KMH</span>
      </div>
    }

    <!-- 🚗 DEFAULT VEHICLE MODE -->
    @default {
      <div class="flex items-end gap-3 mt-4">
        <span class="text-7xl font-extrabold leading-none">
          {{ speed.toFixed(0) }}
        </span>
        <span class="text-xl mb-2 tracking-widest text-gray-300">
          KMH
        </span>
      </div>

      <!-- SPEED BAR -->
      <div class="mt-2 w-full h-1 bg-gray-700 rounded overflow-hidden">
        <div
          class="h-full bg-green-500 transition-all duration-150"
          [style.width.%]="(speed / maxSpeed) * 100">
        </div>
      </div>
    }
  }

  <!-- 🔧 BOTTOM INFO ROW -->
  <div class="flex justify-between items-center mt-4 text-sm text-gray-300">

    <!-- FUEL -->
    <div class="flex items-center gap-2">
      <div class="w-16 h-2 bg-gray-700 rounded overflow-hidden">
        <div
          class="h-full bg-green-500"
          [style.width.%]="fuel">
        </div>
      </div>
      <span>{{ fuel }}%</span>
    </div>

    <!-- MILEAGE -->
    <div class="flex items-center gap-1">
      <span>{{ mileage.toFixed(1) }} km</span>
      <i class="pi pi-car"></i>
    </div>

    <!-- GEAR / RPM -->
    <div class="flex items-center gap-2">
      <span
        class="w-8 h-8 flex items-center justify-center rounded bg-green-600 font-bold">
        {{ gear }}
      </span>
      <span>{{ rpm }}</span>
    </div>

  </div>
</div>
