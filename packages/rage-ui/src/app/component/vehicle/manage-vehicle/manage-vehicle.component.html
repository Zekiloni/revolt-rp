<p-dialog header="{{ 'manage_vehicle' | translate }}" [modal]="true" [(visible)]="isActive"
          (onHide)="close()"
          [focusOnShow]="false"
          styleClass="rounded-2xl"
          [style]="{ width: '40%', 'max-height': '35vh' }" [draggable]="false">

  @if (vehicle) {
    <div class="grid grid-cols-12 gap-4 formgrid p-fluid py-2 px-4">
      <div class="field mb-6 col-span-12 md:col-span-4">
        <label for="model" class="text-surface-700 dark:text-surface-100">{{ 'model' | translate }}</label>
        <input id="model" pInputText [value]="vehicle.model" readonly />
      </div>

      <div class="field mb-6 col-span-12 md:col-span-4">
        <label for="price" class="text-surface-700 dark:text-surface-100">{{ 'price' | translate }}</label>
        <p-inputNumber [(ngModel)]="vehicle.price" id="price" mode="decimal" [minFractionDigits]="2"
                       [maxFractionDigits]="5" placeholder="3200" />
      </div>

      <div class="field mb-6 col-span-12 md:col-span-4 flex items-center gap-1 py-8">
        <p-checkbox
          [(ngModel)]="vehicle.isTemporary"
          [binary]="true"
          id="is-temporary" />
        <label for="is-temporary" class="text-surface-900 dark:text-surface-0 mb-0 ml-2">{{ 'is_temporary' | translate }}</label>
      </div>

      <div class="col-span-12">
        <button pButton type="button" severity="secondary" label="{{ 'cancel' | translate }}" class="w-auto" (click)="close()"></button>
        <button pButton type="button" label="{{ 'save' | translate }}" class="w-auto ml-4" (click)="save()" [disabled]="!anyChanges"></button>
      </div>
    </div>
  }
</p-dialog>
