<div class="col-span-12 flex flex-col lg:flex-row field ng-tns-c39-2">
  <div
    class="flex justify-between p-4 rounded-border border border-surface w-full mr-4 hover:border-primary cursor-pointer ng-tns-c39-2 border-primary bg-surface-50 dark:bg-surface-800">
    <div class="mr-4 lg:mr-0 ng-tns-c39-2">
      <div class="text-surface-900 dark:text-surface-0 font-bold mb-2 ng-tns-c39-2">{{ 'pay_with_cash' | translate }}</div>
      <span class="text-surface-600 dark:text-surface-200 ng-tns-c39-2">{{ 'pay_with_cash_description' | translate }}</span></div>
    <div class="flex justify-between items-center ng-tns-c39-2">
      <p-radioButton
        name="cash"
        [value]="paymentTypeCash"
        [(ngModel)]="payment"
        inputId="ingredient2" />
    </div>
  </div>

  @if ($bankCards | async; as bankCards) {
    @for (bankCard of bankCards; track bankCard.id) {
      <div
        class="flex justify-between p-4 mt-4 lg:mt-0 rounded-border border border-surface w-full hover:border-primary cursor-pointer">
        <div class="mr-4 lg:mr-0">
          <div class="text-surface-900 dark:text-surface-0 font-bold mb-2">{{ 'pay_with_bank_card' | translate }}</div>
          <span class="text-surface-600 dark:text-surface-200">{{ bankCard.bankCardInfo!.bankAccountNo }}</span></div>
        <div class="flex justify-between items-center">
          <p-radioButton
            name="bank-card"
            [value]="getBankCardPayment(bankCard)"
            [(ngModel)]="payment"
            [disabled]="!isCardActive(bankCard)"
            inputId="ingredient2" />
        </div>
      </div>
    }
  }
</div>
