<div class="col-12 flex flex-column lg:flex-row field ng-tns-c39-2">
  <div
    class="flex justify-content-between p-3 border-round border-1 surface-border w-full mr-3 hover:border-primary cursor-pointer ng-tns-c39-2 border-primary surface-50">
    <div class="mr-3 lg:mr-0 ng-tns-c39-2">
      <div class="text-900 font-bold mb-2 ng-tns-c39-2">{{ 'pay_with_cash' | translate }}</div>
      <span class="text-600 ng-tns-c39-2">Delivery: Tomorrow</span></div>
    <div class="flex justify-content-between align-items-center ng-tns-c39-2">
      <p-radioButton
        name="cash"
        [value]="paymentTypeCash"
        [(ngModel)]="payment"
        inputId="ingredient2" />
    </div>
  </div>

  @if ($bankCards | async; as bankCards) {
    @for (bankCard of bankCards; track bankCard.id) {
      <div
        class="flex justify-content-between p-3 mt-3 lg:mt-0 border-round border-1 surface-border w-full hover:border-primary cursor-pointer">
        <div class="mr-3 lg:mr-0">
          <div class="text-900 font-bold mb-2">{{ 'pay_with_bank_card' | translate }}</div>
          <span class="text-600">{{ bankCard.bankCardInfo!.bankAccountNo }}</span></div>
        <div class="flex justify-content-between align-items-center">
          <p-radioButton
            name="bank-card"
            [value]="getBankCardPayment(bankCard)"
            [(ngModel)]="payment"
            [disabled]="!isCardActive(bankCard)"
            inputId="ingredient2" />
        </div>
      </div>
    }
  }
</div>
