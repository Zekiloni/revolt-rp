<div class="text-chat absolute-top-left mt-3 ml-3 lg:w-4 flex flex-column">
  @if (isActive) {
    <ul #messagesList class="list-none messages h-16rem overflow-y-auto overflow-x-hidden p-0 hidden-scroll"
        tabindex="-1"
        (keydown.space)="$event.preventDefault()"
        @fadeInOut>
      @for (message of messages; track message.id) {
        <li class="text-base">
          <p class="m-1">
            @if (showTimestamps) {
              <span class="font-light text-700">[{{ message.createdAt | date: 'M/d/yy @ HH:mm:ss' }}] </span>
            }
            <span class="font-medium" [innerHTML]="message.content | safeHtml"> </span>
          </p>
        </li>
      }
    </ul>

    <p-autoComplete
      #chatInput
      [(ngModel)]="inputContent"
      [hidden]="!isTyping"
      [maxlength]="256"
      [suggestions]="inputContent?.startsWith('/') ? commandSuggestions : []"
      (completeMethod)="filterCommands($event)"
      (keydown.enter)="sendInput()"
      styleClass="w-full"
      panelStyleClass="w-full"
      inputStyleClass="w-full"
      (keydown.escape)="closeChat()"
      [emptyMessage]="'no_results' | translate"
      (keyup.arrowUp)="shiftHistory('up')"
      (keyup.arrowDown)="shiftHistory('down')"
      (keydown.tab)="$event.preventDefault()">
    </p-autoComplete>

  }
</div>
