<section
  class="fixed right-6 top-1/2 -translate-y-1/2 select-none"
>
  <div
    class="rounded-[18px] shadow-elev-card p-[18px] px-5 bg-surface-900/80"
  >
    <!-- Two vertical progress bars with labels -->
    <div class="flex items-start gap-8 justify-center mb-4">

      <!-- LEFT BAR - Line Tension -->
      <div class="flex items-center gap-3">
        <!-- Left side labels -->
        <div class="flex flex-col justify-between h-[300px] text-right text-xs pr-2">
          <span class="text-red-400 font-semibold">High Tension</span>
          <span class="text-yellow-400 font-semibold">Optimal Tension</span>
          <span class="text-green-400 font-semibold">Low Tension</span>
        </div>

        <!-- Vertical slider -->
        <div class="relative">
          <p-slider
            [ngModel]="lineTension"
            orientation="vertical"
            [style]="{'height': '300px', 'rotate': '180deg'}"
            [disabled]="true"
            [styleClass]="lineTension > 70 ? 'tension-high' : lineTension > 40 ? 'tension-medium' : 'tension-low'"
          />
          <!-- Label below -->
          <div class="text-center mt-2 text-xs text-[color:var(--muted)]">
            Line Tension
          </div>
        </div>
      </div>

      <!-- RIGHT BAR - Reel Progress -->
      <div class="flex items-center gap-3">
        <!-- Vertical slider -->
        <div class="relative">
          <p-slider
            [ngModel]="reelWindow"
            orientation="vertical"
            [style]="{'height': '300px', 'rotate': '180deg'}"
            [disabled]="true"
            [styleClass]="reelWindow >= 100 ? 'reel-complete' : reelWindow >= 50 ? 'reel-progress' : 'reel-start'"
          />
          <!-- Label below -->
          <div class="text-center mt-2 text-xs text-[color:var(--muted)]">
            Reel Progress
          </div>
        </div>

        <!-- Right side labels -->
        <div class="flex flex-col justify-between h-[300px] text-left text-xs pl-2">
          <span class="text-green-400 font-semibold">Complete</span>
          <span class="text-yellow-400 font-semibold">Making Progress</span>
          <span class="text-red-400 font-semibold">Just Started</span>
        </div>
      </div>
    </div>

    <!-- Stats info -->
    <div class="flex items-center justify-between text-xs text-[color:var(--muted)] mb-3 px-2">
      <div>
        <span class="text-primary font-bold">{{ lineTension.toFixed(0) }}%</span>
      </div>
      <div>
        <span class="text-primary font-bold">{{ reelWindow.toFixed(0) }}%</span>
      </div>
    </div>

    <!-- Keybind -->
    <div class="flex flex-wrap gap-[10px] my-[14px] mb-[6px] mt-6 justify-center">
      <app-keybind key="SPACE" label="Reel In"></app-keybind>
    </div>

  </div>
</section>
