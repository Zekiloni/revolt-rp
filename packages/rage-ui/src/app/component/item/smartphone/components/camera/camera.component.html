<div class="w-full h-full flex items-center justify-center relative">
  <img src="http://screenshots/take_with_cef" #cameraRef alt="phone-camera"
       style="object-fit: cover; object-position: left center; transform: translateX(-40%) scaleX(-1);">

  <div class="absolute-bottom-center w-full mb-3 flex align-items-center justify-content-center gap-3">
    @if (cameraCaptureInterval) {
      <button pButton icon="pi pi-camera" [rounded]="true" label="Space" [disabled]="isFullMemory"
              pTooltip="{{ 'phone_memory_full' | translate }}"
              [tooltipDisabled]="!isFullMemory"
              (click)="takePhoto()"></button>
      <button pButton icon="pi pi-sync" [outlined]="true" [rounded]="true" size="small" label="Ctrl"
              (click)="changeCameraType()"></button>
    } @else {
      <button pButton icon="pi pi-check" [rounded]="true" severity="success" (click)="savePhoto()"></button>
      <button pButton icon="pi pi-times" [rounded]="true" severity="danger" (click)="cancelPhoto()"></button>
    }
  </div>
</div>
