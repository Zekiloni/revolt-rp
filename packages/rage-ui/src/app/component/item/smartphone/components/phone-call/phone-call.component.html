<div class="flex flex-col items-center h-full bg-black/70">
  <h2>{{ isIncoming ? currentCall.caller : currentCall.receiver }}</h2>

  <span>
    {{ (isIncoming && isRinging ? 'incoming_call' : currentCall.status) | translate }}
  </span>

  @if (!isEndedOrRejected) {
    <h2> {{ $duration | async }}</h2>
  }

  @if (isIncoming && isRinging) {
    <div class="flex justify-center gap-4 mt-8">
      <button pButton [rounded]="true" severity="success" (click)="answer()" icon="pi pi-phone"></button>
      <button pButton [rounded]="true" severity="danger" (click)="end()" icon="pi pi-phone"></button>
    </div>
  } @else {
    <div class="grid grid-cols-12 gap-4 grid-nogutter gap-4 justify-center mt-8">
      <button pButton [rounded]="true" icon="pi pi-volume-up"
              [disabled]="!isOngoing"
              class="col-span-3"></button>
      <button pButton [rounded]="true" icon="pi pi-video" [disabled]="true" class="col-span-3"></button>
      <button pButton [rounded]="true" icon="pi pi-microphone"
              [disabled]="!isOngoing"
              class="col-span-3"></button>
      <button pButton [rounded]="true" icon="pi pi-user-plus"
              [disabled]="!isOngoing"
              class="col-span-3"></button>
      <button pButton [rounded]="true" severity="danger" (click)="end()" icon="pi pi-phone"
              [disabled]="isEndedOrRejected"
              class="rotate-180 col-span-3"></button>
      <button pButton [rounded]="true" icon="pi pi-table"
              [disabled]="!isOngoing"
              class="col-span-3"></button>
    </div>
  }
</div>
