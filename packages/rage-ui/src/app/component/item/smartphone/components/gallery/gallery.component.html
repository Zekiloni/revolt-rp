@if (phoneItem.phoneInfo.gallery.length) {
  <div class="flex flex-column">
    @for (image of images; track image.id) {
      <div class="mb-3 border-bottom-1 surface-border">
        <p-image
          class="w-full"
          [src]="image.url"
          alt="Image"
          width="240"
          [preview]="true" />

        <div class="flex justify-content-between align-items-center bg-black-alpha-30 py-2 px-3">
          <span class="text-700">{{ fromNow(image.createdAt) }}</span>
          <button pButton icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" size="small"
                  (click)="deleteImage(image.id)"></button>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="flex justify-center items-center">
    <p>{{ 'gallery_is_empty' | translate }}</p>
  </div>
}
