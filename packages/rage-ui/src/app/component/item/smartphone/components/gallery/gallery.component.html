@if (phoneItem.phoneInfo.gallery.length) {
  <div class="flex flex-col">
    @for (image of images; track image.id) {
      <div class="mb-4 border-b border-surface">
        <p-image
          class="w-full"
          [src]="image.url"
          alt="Image"
          width="240"
          [preview]="true" />

        <div class="flex justify-between items-center bg-black/30 py-2 px-4">
          <span class="text-surface-700 dark:text-surface-100">{{ fromNow(image.createdAt) }}</span>
          <button pButton icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" size="small"
                  (click)="deleteImage(image.id)"></button>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="flex justify-center items-center">
    <p>{{ 'gallery_is_empty' | translate }}</p>
  </div>
}
