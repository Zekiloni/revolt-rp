<form class="p-fluid formgrid grid grid-cols-12 gap-4 px-4" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="text-surface-700 dark:text-surface-100">{{ 'category' | translate }}</label>
    <p-dropdown
      [options]="categories"
      formControlName="category"
      placeholder="{{'select_category' | translate }}">
      <ng-template let-selectedItem pTemplate="selectedItem">
        <span>{{ selectedItem | translate }}</span>
      </ng-template>
      <ng-template let-category pTemplate="item">
        <span>{{ category | translate }}</span>
      </ng-template>
    </p-dropdown>
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12 p-fluid">
    <label class="text-surface-700 dark:text-surface-100">{{ 'price' | translate }}</label>
    <p-inputNumber formControlName="price" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="5"
                   placeholder="5000" [showClear]="true" />
    <small id="price-help" class="text-surface-500 dark:text-surface-300 text-sm">
      {{ 'ad_price_help' | translate }}
    </small>
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <p-toggleButton
      formControlName="public"
      onLabel="{{ 'public' | translate}}"
      onIcon="pi pi-eye"
      offIcon="pi pi-eye-slash"
      offLabel="{{ 'private' | translate}}" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="text-surface-700 dark:text-surface-100">{{ 'content' | translate }}</label>
    <p-editor formControlName="content"  (focus)="focusContent()"/>
    <small id="content-help" class="text-surface-500 dark:text-surface-300 text-sm">
      {{ 'min_max_length_validation' | translate: { min: MIN_LENGTH, max: MAX_LENGTH } }}
    </small>
  </div>

  <div class="field mb-4 col-span-12 md:col-span-6">
    <button pButton type="submit" label="{{ 'create' | translate }}" class="w-100" [disabled]="form.invalid"></button>
  </div>
</form>
