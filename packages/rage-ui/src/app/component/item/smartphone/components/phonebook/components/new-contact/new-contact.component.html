<div class="py-2 px-4">
  <form [formGroup]="form" class="grid grid-cols-12 gap-4 formgrid grid-nogutter" (ngSubmit)="submit()">
    <div class="field col-span-12">
      <label for="name" class="text-surface-500 dark:text-surface-300">{{ 'name' | translate }}</label>
      <input pInputText id="name" formControlName="name" type="text" />
    </div>

    <div class="field col-span-12">
      <label for="phone-number" class="text-surface-500 dark:text-surface-300">{{ 'phone_number' | translate }}</label>
      <input pInputText id="phone-number" formControlName="phoneNumber" type="text" />
    </div>

    <div class="field col-span-12 flex items-center gap-1">
      <p-checkbox
        id="favorite"
        formControlName="favorite"
        [binary]="true"
        inputId="binary" />
      <label for="favorite" class="ml-2">{{ 'favorite' | translate }}</label>

    </div>

    <Div class="col-span-12">
      <button pButton type="submit" icon="pi pi-user-plus" [label]="'create' | translate"></button>
    </Div>
  </form>
</div>
