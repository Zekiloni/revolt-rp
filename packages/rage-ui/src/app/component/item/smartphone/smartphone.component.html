<div class="absolute-bottom-right">
  @if (isActive) {
    <div
      class="relative w-64 h-[30rem] shadow rounded-3xl mr-8 mb-4 overflow-hidden bg-black/90  border-2 border-black/20"
      @slideInOut>
      <div class="flex flex-col h-full w-full bg-no-repeat bg-cover"
           [style.opacity]="opacity"
           [style.background-image]="'url(' + (background | staticAsset) + ')'">
        <div class="bg-surface-50 dark:bg-surface-950 py-2 px-6 flex items-center justify-between">
          <span>mts</span>
          <span class="text-sm">{{ ($time | async) | date: 'HH:mm' }}</span>
        </div>
        @if (notifications.length) {
          <div class="absolute mt-8 py-2 px-4 w-full overflow-hidden" style="z-index:99">
            <p-messages [(value)]="notifications" />
          </div>
        }
        @if ($phoneCall | async; as phoneCall) {
          <div class="w-full h-full" @scaleInOut>
            <app-phone-call [currentCall]="phoneCall" [phoneInfo]="phoneItem.phoneInfo" (answerCall)="onAnswerCall($event)" (endCall)="onEndCall($event)" />
          </div>
        } @else {
          @if (openedApplication) {
            <div class="w-full h-full bg-black/80 relative overflow-x-hidden overflow-y-auto" @scaleInOut>
              <ng-container [ngComponentOutlet]="openedApplication.component"
                            [ngComponentOutletInputs]="{ phoneItem}"></ng-container>
            </div>
          } @else {
            <div class="grid grid-cols-12 gap-4 grid-nogutter mt-4 px-4">
              @for (app of otherApps; let index = $index; track app.key) {
                <div (click)="openApp($event, app, index)" class="col-span-4 flex flex-col items-center mb-4">
                  <img [ngSrc]="app.icon | staticAsset" [alt]="app.name" width="45" height="45" />
                  <span class="text-xs text-center mt-1"> {{ app.name | translate }}</span>
                </div>
              }
            </div>
            <p-dock [model]="pinnedApps" position="bottom" styleClass="mb-16">
              <ng-template pTemplate="item" let-item>
                <div pBadge value="3" [badgeDisabled]="!item.badge">
                  <img [ngSrc]="item.icon | staticAsset" [alt]="item.name" width="45" height="45" />
                </div>
              </ng-template>
            </p-dock>
          }
        }
        <div
          class="bg-surface-50 dark:bg-surface-950 mt-auto py-2 px-6 flex items-center justify-center border-b-2 border-black/20 border-l-2 border-r-2">
          <button pButton [rounded]="true" icon="pi pi-home" (click)="closeApp()"></button>
        </div>
      </div>
    </div>
  }
</div>
