<p-dialog [header]="'help' | translate" [modal]="true" [(visible)]="isActive"
          (onHide)="close()"
          [focusOnShow]="false"
          styleClass="border-round-2xl"
          [style]="{ width: '60rem', 'max-height': '75vh' }" [draggable]="false">

  <p-table
    #helpTable
    [value]="commands"
    [paginator]="true"
    [rows]="5"
    dataKey="name"
    styleClass="p-datatable-gridlines"
    paginatorDropdownAppendTo="body"
    [tableStyle]="{ 'min-width': '50rem' }"
    [globalFilterFields]="['name', 'description', 'category']"
    [rowsPerPageOptions]="[5, 10, 20]"
  >
    <ng-template pTemplate="caption">
      <div class="flex">
        <p-iconField iconPosition="left" class="ml-auto">
          <p-inputIcon>
            <i class="pi pi-search"></i>
          </p-inputIcon>
          <input
            pInputText
            type="text"
            (input)="filterGlobal(helpTable, $event.target!)"
            [placeholder]="'search' | translate" />
        </p-iconField>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th width="15%">{{ 'command' | translate }}</th>
        <th width="20%">{{ 'category' | translate }}</th>
        <th>{{ 'description' | translate }}</th>
        <th>{{ 'params' | translate }}</th>
      </tr>
      <tr>
        <th></th>
        <th>
          <p-columnFilter field="category" matchMode="equals" [showMenu]="false">
            <ng-template pTemplate="filter" let-value let-filter="filterCallback">
              <p-dropdown
                [ngModel]="categorySearch"
                [options]="categories"
                (onChange)="filter($event.value)"
                [showClear]="true">
                <ng-template let-option pTemplate="item">
                  <p-tag
                    [value]="option | translate"
                    [severity]="getCategorySeverity(option)" />
                </ng-template>
              </p-dropdown>
            </ng-template>
          </p-columnFilter>
        </th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-command>
      <tr>
        <td>/{{ command['name'] }}</td>
        <td>
          <p-tag [severity]="getCategorySeverity(command['category'])" [value]="command['category'] | translate | titlecase" />
        </td>
        <td>{{ command['description'] }}</td>
        <td>{{ command['params'] || '/' }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
