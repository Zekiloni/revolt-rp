<p-dialog [header]="'help' | translate" [modal]="true" [(visible)]="isActive"
          (onHide)="close()"
          [focusOnShow]="false"
          styleClass="rounded-2xl"
          [style]="{ width: '60rem' }" [draggable]="false">

  <p-table
    #helpTable
    [value]="commands"
    [paginator]="true"
    [rows]="5"
    dataKey="name"
    [scrollable]="true"
    sortField="category"
    [sortOrder]="-1"
    sortMode="single"
    scrollHeight="525px"
    styleClass="p-datatable-gridlines"
    paginatorDropdownAppendTo="body"
    [tableStyle]="{ 'min-width': '50rem' }"
    [globalFilterFields]="['name', 'description', 'category']"
    [rowsPerPageOptions]="[5, 10, 20]"
  >
    <ng-template pTemplate="caption">
      <div class="flex items-center justify-between">
        <span>{{ 'commands_table' | translate }}</span>
        <p-iconField iconPosition="left" class="ml-auto">
          <p-inputIcon>
            <i class="pi pi-search"></i>
          </p-inputIcon>
          <input
            pInputText
            type="text"
            (input)="filterGlobal(helpTable, $event.target!)"
            [placeholder]="'search' | translate" />
        </p-iconField>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>{{ 'command' | translate }}</th>
        <th width="20%">
          <div class="flex items-center gap-2">
            <span>{{ 'category' | translate }}</span>
            <p-columnFilter field="category" matchMode="equals" display="menu" [showMenu]="true"
                            [showMatchModes]="false" [showAddButton]="false" [showOperator]="false"
                            [showClearButton]="false"
                            [showApplyButton]="false">
              <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                <p-dropdown
                  [ngModel]="value"
                  [options]="categories"
                  appendTo="body"
                  [placeholder]="'any' | translate"
                  (onChange)="filter($event.value)"
                  [showClear]="true">
                  <ng-template let-selectedItem pTemplate="selectedItem">
                    <p-tag
                      [value]="selectedItem | translate"
                      [severity]="getCategorySeverity(selectedItem)" />
                  </ng-template>
                  <ng-template let-option pTemplate="item">
                    <p-tag
                      [value]="option | translate"
                      [severity]="getCategorySeverity(option)" />
                  </ng-template>
                </p-dropdown>
              </ng-template>
            </p-columnFilter>
          </div>
        </th>
        <th>{{ 'description' | translate }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-command>
      <tr>
        <td>
          <p-inputGroup>
            <input pInputText readonly [value]="getCommandSyntax(command)" class="w-full">
            <p-inputGroupAddon>
              <p-button icon="pi pi-copy" (click)="copyToClipboard(getCommandSyntax(command))" [text]="true"></p-button>
            </p-inputGroupAddon>
          </p-inputGroup>
        </td>
        <td>
          <p-tag [severity]="getCategorySeverity(command['category'])"
                 [value]="command['category'] | translate | titlecase" />
        </td>
        <td>{{ command['description'] }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">{{ 'no_results' | translate }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
