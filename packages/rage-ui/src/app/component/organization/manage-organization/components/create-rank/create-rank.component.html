<form [formGroup]="createRankFormGroup" class="grid grid-cols-12 gap-4 formgrid p-fluid" (ngSubmit)="submitCreateRankForm()">
  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="block" for="name">{{ 'name' | translate }}</label>
    <input pInputText formControlName="name" id="name">
    <small id="name-help" class="text-surface-600 dark:text-surface-200">
      {{ 'min_max_length_validation' | translate: { min: MIN_NAME_LENGTH, max: MAX_NAME_LENGTH } }}
    </small>
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="block" for="permission">{{ 'permission' | translate }}</label>
    <p-dropdown
      [options]="rankPermissions"
      formControlName="permission"
      id="permission"
      appendTo="body"
    >
      <ng-template let-selectedItem pTemplate="selectedItem">
        <span>{{ selectedItem | translate }}</span>
      </ng-template>
      <ng-template let-permission pTemplate="item">
        <span>{{ permission | translate }}</span>
      </ng-template>
    </p-dropdown>
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="block" for="name">{{ 'salary' | translate }}</label>
    <p-inputNumber formControlName="salary" id="salary" />
  </div>

  <div class="col-span-12 md:col-span-12">
    <button pButton type="submit" [label]="'create' | translate" [disabled]="isFormInvalid"></button>
  </div>
</form>
