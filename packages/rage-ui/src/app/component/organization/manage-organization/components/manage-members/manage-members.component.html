<p-table
  #membersTable
  [value]="members"
  [paginator]="true"
  [rows]="10"
  paginatorDropdownAppendTo="body"
  dataKey="id"
  [globalFilterFields]="['firstName', 'lastName', 'fullName', 'membership.rank.name', 'averageActivity', 'account.username']"
  styleClass="p-datatable-gridlines"
  editMode="cell"
  [tableStyle]="{ 'min-width': '30rem' }"
  [rowsPerPageOptions]="[10, 25, 50]"
>
  <ng-template pTemplate="caption">
    <div class="flex align-items-center justify-content-between">
      <span>{{ 'members' | translate }}</span>
      <p-iconField iconPosition="left">
        <p-inputIcon>
          <i class="pi pi-search"></i>
        </p-inputIcon>
        <input
          pInputText
          type="text"
          (input)="filterGlobal(membersTable, $event.target!)"
          [placeholder]="'search' | translate" />
      </p-iconField>
      <p-button icon="pi pi-plus" [label]="'invite' | translate" size="small" />
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width:5%">#</th>
      <th pSortableColumn="fullName">
        {{ 'name' | translate }}
        <p-sortIcon field="fullName" />
      </th>
      <th>{{ 'rank' | translate }}</th>
      <th pSortableColumn="averageActivity" style="width:15%">
        {{ 'activity' | translate }}
        <p-sortIcon field="averageActivity" />
      </th>
      <th style="width: 15%">{{ 'options' | translate }}</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-member let-editing="editing" let-rowIndex="rowIndex">
    <tr>
      <td>{{ rowIndex + 1 }}</td>
      <td>{{ member['fullName'] }} <small>({{ member['account']['username'] }})</small></td>
      <td [pEditableColumn]="member['membership']['rank']" pEditableColumnField="rank">
        <p-cellEditor>
          <ng-template pTemplate="input">
            <p-dropdown
              [options]="ranks"
              appendTo="body"
              optionLabel="name"
              [(ngModel)]="member['membership']['rank']"
              [style]="{'width':'100%'}" />
          </ng-template>
          <ng-template pTemplate="output">
            <p-chip
              [label]="member['membership']['rank']['name'] || ('unranked' | translate)" />
          </ng-template>
        </p-cellEditor>
      </td>
      <td>
        <span [ngClass]="getActivityColor(member['averageActivity'])"
              [pTooltip]="getActivityLabel(member['averageActivity']) | translate">
          {{ member['averageActivity'] }}
        </span>
      </td>
      <td>
        <button pButton icon="pi pi-user-minus" [rounded]="true" [text]="true" severity="danger"
                [label]="'uninvite' | translate"
                (click)="uninvite($event, member)"></button>
      </td>
    </tr>
    <p-confirmPopup />

  </ng-template>
</p-table>
