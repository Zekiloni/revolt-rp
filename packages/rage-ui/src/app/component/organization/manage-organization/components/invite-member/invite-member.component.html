<form [formGroup]="inviteMemberFormGroup" class="grid grid-cols-12 gap-4 formgrid p-fluid" (ngSubmit)="submitInviteMemberForm()">
  <div class="field mb-6 col-span-12 md:col-span-12">
    <label for="target">{{ 'target_player' | translate }}</label>
    <p-dropdown
      [options]="players"
      optionLabel="name"
      formControlName="playerId"
      id="target"
      optionValue="id"
      [filter]="true"
      [emptyFilterMessage]="'no_results' | translate"
      [emptyMessage]="'no_results' | translate"
      appendTo="body"
      (onFilter)="filterPlayers($event)"
      [placeholder]="'select_player' | translate" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label for="rank">{{ 'rank' | translate }}</label>
    <p-dropdown
      [options]="ranks"
      optionLabel="name"
      id="rank"
      optionValue="id"
      [filter]="true"
      formControlName="rankId"
      [emptyFilterMessage]="'no_results' | translate"
      [emptyMessage]="'no_results' | translate"
      appendTo="body"
      [placeholder]="'select_rank' | translate" />
  </div>

  <div class="col-span-12 md:col-span-12">
    <button pButton type="submit" [label]="'invite' | translate" [disabled]="isFormInvalid"></button>
  </div>
</form>
