<p-table
  #ranksTable
  [value]="ranks"
  [paginator]="true"
  [rows]="10"
  paginatorDropdownAppendTo="body"
  dataKey="id"
  [globalFilterFields]="['name', 'permission', 'salary']"
  styleClass="p-datatable-gridlines"
  editMode="row"
  [tableStyle]="{ 'min-width': '30rem' }"
  [rowsPerPageOptions]="[10, 25, 50]"
>
  <ng-template pTemplate="caption">
    <div class="flex align-items-center justify-content-between">
      {{ 'ranks' | translate }}
      <p-iconField iconPosition="left">
        <p-inputIcon>
          <i class="pi pi-search"></i>
        </p-inputIcon>
        <input
          pInputText
          type="text"
          (input)="filterGlobal(ranksTable, $event.target!)"
          [placeholder]="'search' | translate" />
      </p-iconField>
      <p-button icon="pi pi-plus" [label]="'create' | translate" size="small" (click)="createRank()" />
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width:5%">#</th>
      <th>{{ 'name' | translate }}</th>
      <th>{{ 'permission' | translate }}</th>
      <th>{{ 'salary' | translate }}</th>
      <th>{{ 'options' | translate }}</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rank let-editing="editing" let-rowIndex="rowIndex">
    <tr [pEditableRow]="rank">
      <td>{{ rowIndex + 1 }}</td>
      <td>{{ rank['name'] }}</td>
      <td>{{ rank['permission'] | translate }}</td>
      <td>{{ rank['salary'] }}</td>
      <td>
        @if (editing) {
          <button
            pButton
            type="button"
            pSaveEditableRow
            icon="pi pi-check"
            (click)="editSave(rank, rowIndex)"
            class="p-button-rounded p-button-text p-button-success mr-2">
          </button>
          <button
            pButton
            type="button"
            pCancelEditableRow
            icon="pi pi-times"
            (click)="editCancel(rank, rowIndex)"
            class="p-button-rounded p-button-text p-button-danger">
          </button>
        } @else {
          <button pButton icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                  (click)="deleteRank($event, rank)"></button>
          <button pButton icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="editInit(rank)"></button>
        }
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5">{{ 'no_ranks' | translate }}</td>
    </tr>
  </ng-template>
</p-table>
<p-confirmPopup />
