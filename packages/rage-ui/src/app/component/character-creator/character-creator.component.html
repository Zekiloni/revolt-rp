<div class="absolute-left-center ml-5 lg:w-4">
  <div class="surface-card p-4 shadow-2 border-round">
    <div class="flex justify-content-between align-items-center mb-5">
      <span class="text-xl text-900 font-medium">Character Creator</span>
    </div>

    <p-stepper orientation="vertical">
      <p-stepperPanel header="Character Identity">
        <ng-template pTemplate="content" let-nextCallback="nextCallback" let-index="index">
          <div class="flex flex-column">
            <app-character-details [characterCreateForm]="createCharacterForm" />
            <p-button class="py-4" label="Next" (onClick)="nextCallback.emit()" />
          </div>
        </ng-template>
      </p-stepperPanel>

      <p-stepperPanel header="Character Description">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                     let-index="index">
          <div class="flex flex-column">
            <div class="formgrid grid py-4 px-4">
              <div class="field col-12 md:col-12" [formGroup]="createCharacterForm">
                <label for="character-description" class="font-medium text-900">Description</label>
                <textarea
                  id="character-description"
                  rows="5"
                  cols="30"
                  class="block w-full"
                  pInputTextarea
                  formControlName="description">
              </textarea>
              </div>
            </div>

            <div class="flex py-4 gap-2">
              <p-button label="Back" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button label="Next" (onClick)="nextCallback.emit()" />
            </div>
          </div>
        </ng-template>
      </p-stepperPanel>

      <p-stepperPanel header="Character Appearance">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                     let-index="index">
          <div class="flex flex-column">
            <p-accordion [activeIndex]="0" class="py-4 px-4">
              <p-accordionTab header="Heritage Appearance Settings">
                <app-head-blend-data [headBlendData]="headBlendData" />
              </p-accordionTab>
              <p-accordionTab header="Face Structure">
                <app-face-feature [appearanceFormGroup]="appearance" />
              </p-accordionTab>
              <p-accordionTab header="Facial Hair">
                <app-facial-hair [gender]="gender!" [appearanceFormGroup]="appearance" />
              </p-accordionTab>
            </p-accordion>
            <div class="flex py-4 gap-2">
              <p-button label="Back" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button label="Next" (onClick)="nextCallback.emit()" />
            </div>
          </div>
        </ng-template>
      </p-stepperPanel>
      <p-stepperPanel header="Character Outfit">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-index="index">
          <div class="flex flex-column h-12rem">
            <div
              class="border-2 border-dashed surface-border border-round surface-ground flex-auto flex justify-content-center align-items-center font-medium">
              Content III
            </div>
          </div>

          <div class="flex py-4 gap-2">
            <p-button label="Back" severity="secondary" (onClick)="prevCallback.emit()" />
            <p-button label="Create" (onClick)="submitCreateCharacterForm()" [disabled]="createCharacterForm.invalid" />
          </div>
        </ng-template>
      </p-stepperPanel>
    </p-stepper>
  </div>

  <p-messages severity="info">
    <ng-template pTemplate>
      <div>Hold
        <p-tag value="Mouse Right" />
        +
        <p-tag value="Mouse Scroll" />
        to move the camera around and to zoom in and out.
      </div>
    </ng-template>
  </p-messages>
</div>
