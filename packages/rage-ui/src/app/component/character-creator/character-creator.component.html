<div class="absolute-left-center ml-5 lg:w-4">
  <div class="surface-card p-4 shadow-2 border-round">
    <div class="flex justify-content-between align-items-center mb-5">
      <span class="text-xl text-900 font-medium">{{ 'character_creator' | translate }}</span>
    </div>

    <p-stepper orientation="vertical">
      <p-stepperPanel [header]="'character_identity' | translate">
        <ng-template pTemplate="content" let-nextCallback="nextCallback" let-index="index">
          <div class="flex flex-column">
            <app-character-details [characterCreateForm]="createCharacterForm" />
            <p-button class="py-4" [label]="'next' | translate" (onClick)="nextCallback.emit()" />
          </div>
        </ng-template>
      </p-stepperPanel>

      <p-stepperPanel [header]="'character_description' | translate">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                     let-index="index">
          <div class="flex flex-column">
            <div class="formgrid grid py-4 px-4">
              <div class="field col-12 md:col-12" [formGroup]="createCharacterForm">
                <label for="character-description" class="font-medium text-900">{{ 'description' | translate }}</label>
                <textarea
                  id="character-description"
                  rows="5"
                  cols="30"
                  class="block w-full"
                  pInputTextarea
                  formControlName="description">
              </textarea>
              </div>
            </div>

            <div class="flex py-4 gap-2">
              <p-button [label]="'back' | translate" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button [label]="'next' | translate" (onClick)="nextCallback.emit()" />
            </div>
          </div>
        </ng-template>
      </p-stepperPanel>

      <p-stepperPanel header="Character Appearance">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                     let-index="index">
          <div class="flex flex-column">
            <p-accordion [activeIndex]="0" class="py-4 px-4">
              <p-accordionTab [header]="'heritage' | translate">
                <app-head-blend-data [headBlendData]="headBlendData" />
              </p-accordionTab>
              <p-accordionTab [header]="'face_features' | translate">
                <app-face-feature [appearanceFormGroup]="appearance" />
              </p-accordionTab>
              <p-accordionTab [header]="'hair' | translate">
                <app-hair [gender]="gender!" [appearanceFormGroup]="appearance" />
              </p-accordionTab>
              <p-accordionTab [header]="'beard' | translate" [disabled]="gender === CharacterGender.FEMALE">
                <app-beard [appearanceFormGroup]="appearance" />
              </p-accordionTab>
              <p-accordionTab [header]="'other' | translate">
                <div class="max-h-15rem overflow-auto">
                  @for (headOverlay of headOverlays; track headOverlay.overlayId) {
                    <p-panel [header]="headOverlay.label" [toggleable]="true" [collapsed]="true">
                      <app-head-overlay [headOverlayInfo]="headOverlay"
                                        [headOverlayForm]="getHeadOverlayComponentForm(headOverlay.key)" />
                    </p-panel>
                  }
                </div>
              </p-accordionTab>
            </p-accordion>
            <div class="flex py-4 gap-2">
              <p-button [label]="'back' | translate" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button [label]="'next' | translate" (onClick)="nextCallback.emit()" />
            </div>
          </div>
        </ng-template>
      </p-stepperPanel>
      <p-stepperPanel header="Character Outfit">
        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-index="index">
          <div class="flex flex-column">
            <app-outfit-selector [createCharacterForm]="createCharacterForm" />
          </div>

          <div class="flex py-4 gap-2">
            <p-button [label]="'back' | translate" severity="secondary" (onClick)="prevCallback.emit()" />
            <p-button [label]="'submit' | translate" (onClick)="submitCreateCharacterForm()" [disabled]="createCharacterForm.invalid" />
          </div>
        </ng-template>
      </p-stepperPanel>
    </p-stepper>
  </div>

  <p-messages severity="info">
    <ng-template pTemplate>
      <div>{{ 'hold' | translate }} <p-tag [value]="'mouse_left' | translate" /> + <p-tag [value]="'mouse_right' | translate" /> + <p-tag [value]="'mouse_scroll' | translate" />
        {{ 'to_move_camera' | translate }}
      </div>
    </ng-template>
  </p-messages>
</div>
