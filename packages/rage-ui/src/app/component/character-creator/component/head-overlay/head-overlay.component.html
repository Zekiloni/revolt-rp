<div class="formgrid grid grid-cols-12 gap-4 py-6 px-6 max-h-60 overflow-auto" [formGroup]="headOverlayForm">
  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="font-medium text-surface-900 dark:text-surface-0">{{ headOverlayInfo.label }}</label>
    <p-dropdown
      formControlName="value"
      [options]="values"
      optionValue="value"
      optionLabel="label"
      appendTo="body"
      [filter]="true"
      styleClass="w-[25rem]"
      [showClear]="true"
      (onClear)="onHeadOverlayClear()"
      placeholder="Select a {{ headOverlayInfo.label}}" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-6">
    <label for='opacity' class="font-medium text-surface-900 dark:text-surface-0">{{ headOverlayInfo.label }} Opacity</label>
    <p-slider id="opacity"
              [min]="0.0"
              [max]="1.0"
              [step]="0.1"
              formControlName="opacity" />
  </div>
</div>
