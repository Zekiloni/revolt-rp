<div class="formgrid grid py-4 px-4 max-h-15rem overflow-auto" [formGroup]="headOverlayForm">
  <div class="field mb-4 col-12 md:col-12">
    <label class="font-medium text-900">{{ headOverlayInfo.label }}</label>
    <p-dropdown
      formControlName="value"
      [options]="values"
      optionValue="value"
      optionLabel="label"
      appendTo="body"
      [filter]="true"
      styleClass="w-25rem"
      [showClear]="true"
      (onClear)="onHeadOverlayClear()"
      placeholder="Select a {{ headOverlayInfo.label}}" />
  </div>

  <div class="field mb-4 col-12 md:col-6">
    <label for='opacity' class="font-medium text-900">{{ headOverlayInfo.label }} Opacity</label>
    <p-slider id="opacity"
              [min]="0.0"
              [max]="1.0"
              [step]="0.1"
              formControlName="opacity" />
  </div>
</div>
