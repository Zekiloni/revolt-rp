<div class="grid py-4 px-4 max-h-15rem overflow-auto" [formGroup]="headBlendData">
  <div class="field mb-4 col-12 md:col-6">
    <label for="shape-first-id" class="font-medium text-900">Mother</label>

    <a pRipple
       class="flex align-items-center cursor-pointer p-3 border-round text-700">
      <img [src]="getParentImage(headBlendData.get('shapeFirstId')?.value!)" class="mr-2"
           style="width: 52px; height: 52px;" alt="mother-image">
      <span class="font-medium">{{ getParentName(headBlendData.get('shapeFirstId')?.value!) }}</span>
    </a>

    <p-slider id="shape-first-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="shapeFirstId" />
  </div>

  <div class="field mb-4 col-12 md:col-6">
    <label for="shape-second-id" class="font-medium text-900">Father</label>

    <a pRipple
       class="flex align-items-center cursor-pointer p-3 border-round text-700">
      <img [src]="getParentImage(headBlendData.get('shapeSecondId')?.value!)" class="mr-2"
           style="width: 52px; height: 52px;" alt="father-image">
      <span class="font-medium">{{ getParentName(headBlendData.get('shapeSecondId')?.value!) }}</span>
    </a>

    <p-slider id="shape-second-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="shapeSecondId" />
  </div>

  <div class="field mb-4 col-12 md:col-12">
    <label for="skin-second-id" class="font-medium text-900">Shape Mix</label>
    <p-slider id="shape-mix"
              [min]="0.1"
              [max]="1.0"
              [step]="0.1"
              formControlName="shapeMix" />
  </div>

  <div class="field mb-4 col-12 md:col-6">
    <label for="skin-first-id" class="font-medium text-900">Mother Skin Tone</label>
    <p-slider id="skin-first-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="skinFirstId" />
  </div>

  <div class="field mb-4 col-12 md:col-6">
    <label for="skin-second-id" class="font-medium text-900">Father Skin Tone</label>
    <p-slider id="skin-second-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="skinFirstId" />
  </div>

  <div class="field mb-4 col-12 md:col-12">
    <label for="skin-mix" class="font-medium text-900">Skin Tone Mix</label>
    <p-slider id="skin-mix"
              [min]="0.1"
              [max]="1.0"
              [step]="0.1"
              formControlName="skinMix" />
  </div>

</div>
