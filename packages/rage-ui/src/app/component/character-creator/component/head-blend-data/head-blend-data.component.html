<div class="grid grid-cols-12 gap-4 py-6 px-6 max-h-60 overflow-auto" [formGroup]="headBlendData">
  <div class="field mb-6 col-span-12 md:col-span-6">
    <label for="shape-first-id" class="font-medium text-surface-900 dark:text-surface-0">Mother</label>

    <a pRipple
       class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100">
      <img [ngSrc]="getParentImage(headBlendData.get('shapeFirstId')?.value!) | staticAsset" class="mr-2"
           style="width: 52px; height: 52px;" alt="mother-image" width="50" height="50">
      <span class="font-medium">{{ getParentName(headBlendData.get('shapeFirstId')?.value!) }}</span>
    </a>

    <p-slider id="shape-first-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="shapeFirstId" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-6">
    <label for="shape-second-id" class="font-medium text-surface-900 dark:text-surface-0">Father</label>

    <a pRipple
       class="flex items-center cursor-pointer p-4 rounded-border text-surface-700 dark:text-surface-100">
      <img [ngSrc]="getParentImage(headBlendData.get('shapeSecondId')?.value!) | staticAsset" class="mr-2"
           style="width: 52px; height: 52px;" alt="mother-image" width="50" height="50">
      <span class="font-medium">{{ getParentName(headBlendData.get('shapeSecondId')?.value!) }}</span>
    </a>

    <p-slider id="shape-second-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="shapeSecondId" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label for="skin-second-id" class="font-medium text-surface-900 dark:text-surface-0">Shape Mix</label>
    <p-slider id="shape-mix"
              [min]="0.1"
              [max]="1.0"
              [step]="0.1"
              formControlName="shapeMix" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-6">
    <label for="skin-first-id" class="font-medium text-surface-900 dark:text-surface-0">Mother Skin Tone</label>
    <p-slider id="skin-first-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="skinFirstId" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-6">
    <label for="skin-second-id" class="font-medium text-surface-900 dark:text-surface-0">Father Skin Tone</label>
    <p-slider id="skin-second-id"
              [min]="0"
              [max]="maxParentId"
              formControlName="skinFirstId" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label for="skin-mix" class="font-medium text-surface-900 dark:text-surface-0">Skin Tone Mix</label>
    <p-slider id="skin-mix"
              [min]="0.1"
              [max]="1.0"
              [step]="0.1"
              formControlName="skinMix" />
  </div>

</div>
