<div class="formgrid grid py-4 px-4 max-h-15rem overflow-auto" [formGroup]="appearanceFormGroup">
  <div class="field mb-4 col-12 md:col-6">
    <label class="font-medium text-900">Hair Style {{ appearanceFormGroup.get('hairStyle')?.value}}</label>
    <p-slider id="shape-first-id"
              [min]="0"
              (onChange)="handleHairStyleChange($event)"
              [max]="hairStyles.length -1"
    />
  </div>
</div>
