
<div class="formgrid grid grid-cols-12 gap-4 py-6 px-6 max-h-60 overflow-auto" [formGroup]="appearanceFormGroup">
  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="font-medium text-surface-900 dark:text-surface-0">Hair Style</label>
    <p-dropdown
      formControlName="hairStyle"
      [options]="availableHairStyles"
      optionLabel="label"
      appendTo="body"
      [filter]="true"
      styleClass="w-[25rem]"
      optionValue="value"
      placeholder="Select a Hairstyle" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="font-medium text-surface-900 dark:text-surface-0">Hair Color</label>
    <ul class="list-none p-0 flex flex-wrap gap-4">
      @for (color of hairColors; track color; let idx = $index) {
        <li
          class="rounded-full cursor-pointer border-4 border-transparent hover:border-white/90 duration-150 transition-colors"
          [ngClass]="{ 'border-white-alpha-90': idx === hairColor }"
          (click)="hairColor = idx"
          [style]="{ background: color, width: '22px', height: '22px' }"></li>
      }
    </ul>
  </div>

  <div class="field mb-6 col-span-12 md:col-span-12">
    <label class="font-medium text-surface-900 dark:text-surface-0">Hair Highlight Color</label>
    <ul class="list-none p-0 flex flex-wrap gap-4">
      @for (color of hairColors; track color; let idx = $index) {
        <li
          class="rounded-full cursor-pointer border-4 border-transparent hover:border-white/90 duration-150 transition-colors"
          [ngClass]="{ 'border-white-alpha-90': idx === hairHighlightColor }"
          (click)="hairHighlightColor = idx"
          [style]="{ background: color, width: '22px', height: '22px' }"></li>
      }
    </ul>
  </div>
</div>
