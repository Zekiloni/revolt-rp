<div class="formgrid grid py-4 px-4 max-h-15rem overflow-auto" [formGroup]="appearanceFormGroup">
  <div class="field mb-4 col-12 md:col-12">
    <label class="font-medium text-900">Beard Style</label>
    <p-dropdown
      formControlName="beardStyle"
      [options]="beardStyles"
      optionLabel="label"
      appendTo="body"
      [filter]="true"
      styleClass="w-25rem"
      optionValue="value"
      [showClear]="true"
      (onClear)="clearBeardStyle()"
      placeholder="Select a Beard" />

  </div>

  <div class="field mb-4 col-12 md:col-12">
    <label class="font-medium text-900">Beard Color</label>
    <ul class="list-none p-0 flex flex-wrap gap-3">
      @for (color of hairColors; track color; let idx = $index) {
        <li
          class="border-circle cursor-pointer border-3 border-transparent hover:border-white-alpha-90 transition-duration-150 transition-colors"
          [ngClass]="{ 'border-white-alpha-90': idx === beardColor }"
          (click)="beardColor = idx"
          [style]="{ background: color, width: '22px', height: '22px' }"></li>
      }
    </ul>
  </div>

  <div class="field mb-4 col-12 md:col-6">
    <label for='beard-opacity' class="font-medium text-900">Beard Opacity</label>
    <p-slider id="beard-opacity"
              [min]="0.0"
              [max]="1.0"
              [step]="0.1"
              formControlName="beardOpacity" />
  </div>
</div>
