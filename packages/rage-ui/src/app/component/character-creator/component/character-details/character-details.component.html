<div class="grid grid-cols-12 gap-4 formgrid py-6 px-6" [formGroup]="characterCreateForm">
  <div class="field p-fluid  mb-6 col-span-12 md:col-span-6">
    <label for="first-name" class="font-medium text-surface-900 dark:text-surface-0">{{ 'first_name' | translate }}</label>
    <input id="first-name" type="text" pInputText formControlName="firstName">
  </div>

  <div class="field p-fluid mb-6 col-span-12 md:col-span-6">
    <label for="middle-name" class="font-medium text-surface-900 dark:text-surface-0">{{ 'middle_name' | translate }}</label>
    <input id="middle-name" type="text" pInputText formControlName="middleName">
  </div>

  <div class="field p-fluid mb-6 col-span-12 md:col-span-6">
    <label for="last-name" class="font-medium text-surface-900 dark:text-surface-0">{{ 'last_name' | translate }}</label>
    <input id="last-name" type="text" pInputText formControlName="lastName">
  </div>

  <div class="field p-fluid mb-6 col-span-12 md:col-span-6">
    <label for="birthday" class="font-medium text-surface-900 dark:text-surface-0">{{ 'birthday' | translate }}</label>
    <p-calendar id="birthday" formControlName="birthday" [showIcon]="true" placeholder="mm/dd/yyyy" />
  </div>

  <div class="field mb-6 col-span-12 md:col-span-6">
    <label for="gender" class="font-medium text-surface-900 dark:text-surface-0">{{ 'gender' | translate }}</label>
    <p-selectButton
      id="gender"
      [options]="genders"
      formControlName="gender"
      optionValue="value"
      [allowEmpty]="false"
      optionLabel="label">
      <ng-template let-item pTemplate>
        <i [class]="item.icon"></i>
        <span class="ml-2">{{ item.label | translate }}</span>
      </ng-template>
    </p-selectButton>
  </div>

  <div class="field mb-6 col-span-12 md:col-span-6">
    <label for="blood-type" class="font-medium text-surface-900 dark:text-surface-0">{{ 'blood_type' | translate }}</label>
    <p-dropdown
      id="blood-type"
      [options]="bloodTypes"
      formControlName="bloodType"
      class="block"
      [placeholder]="'select_a_blood_type' | translate" />
  </div>

  <div class="field p-fluid col-span-12 md:col-span-6">
    <label for="origin" class="font-medium text-surface-900 dark:text-surface-0">{{ 'origin' | translate }}</label>
    <input id="origin" type="text" pInputText formControlName="origin" placeholder="Los Santos, San Andreas">
  </div>

  <div class="field p-fluid col-span-12 md:col-span-6">
    <label for="accent" class="font-medium text-surface-900 dark:text-surface-0">{{ 'accent' | translate }}</label>
    <input id="accent" type="text" pInputText formControlName="accent" placeholder="American">
  </div>
</div>
