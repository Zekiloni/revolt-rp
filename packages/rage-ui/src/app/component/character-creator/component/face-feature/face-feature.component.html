<div class="formgrid grid py-4 px-4 max-h-15rem overflow-auto" [formGroup]="appearanceFormGroup">
  <div class="field mb-4 col-12 md:col-12">
    <label class="font-medium text-900">Eye Color</label>
    <ul class="list-none p-0 flex flex-wrap gap-2">
      @for (color of eyeColors; track color) {
        <li class="w-1rem h-1rem border-circle cursor-pointer border-100 hover:border-primary-50 transition-duration-150 transition-colors" [style]="{ background: getEyeColor(color) }"></li>
      }
    </ul>
  </div>

  @for (faceFeatureName of faceFeatureNames; track faceFeatureName; let idx = $index) {
    <div class="field mb-4 col-12 md:col-6">
      <label class="font-medium text-900">{{ faceFeatureName }}</label>
      <p-slider id="shape-first-id"
                [min]="-1.0"
                [max]="1.0"
                [step]="0.1"
                [formControl]="getFormControl(idx)" />
    </div>
  }
</div>
