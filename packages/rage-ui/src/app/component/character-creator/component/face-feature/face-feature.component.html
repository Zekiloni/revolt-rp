<div class="grid py-4 px-4 max-h-15rem overflow-auto" [formGroup]="appearanceFormGroup" >

  @for (faceFeatureName of faceFeatureNames; track faceFeatureName; let idx = $index) {
    <div class="field mb-4 col-12 md:col-6">
      <label class="font-medium text-900">{{ faceFeatureName }}</label>
      <p-slider id="shape-first-id"
                [min]="-1.0"
                [max]="1.0"
                [step]="0.1"
                [formControl]="getFormControl(idx)" />
    </div>
  }
</div>
