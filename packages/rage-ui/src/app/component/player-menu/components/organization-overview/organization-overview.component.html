@if ($organization | async; as organization) {
  {{ organization | json }}
} @else {
  <p-messages severity="warn">
    <ng-template pTemplate>
      <i class="pi pi-exclamation-circle"></i>
      <div class="ml-2">{{ 'you_dont_have_membership' | translate }}</div>
    </ng-template>
  </p-messages>
}
