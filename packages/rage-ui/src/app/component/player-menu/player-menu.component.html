<p-dialog [showHeader]="false" [(visible)]="isActive"
          (onHide)="close()"
          [focusOnShow]="false"
          contentStyleClass="py-4 px-4 rounded-2xl h-full flex overflow-hidden"
          styleClass="rounded-2xl"
          [style]="{ width: '65rem', maxHeight: '55%' }" [draggable]="false">
  <div class="flex w-full flex-auto">
    <div class="rounded-border select-none py-4 px-2 ">
      @for (item of menuItems; track $index) {
        <article
          class="py-2 px-4 flex w-full justify-between items-center mb-4 select-none cursor-pointer border-surface hover:bg-emphasis rounded-lg px-2 py-1 text-surface-800 dark:text-surface-50 hover:text-primary"
          [ngClass]="{
            'bg-emphasis text-primary': isActiveMenuItem(item)
          }"
          (click)="show(item)">
          <div class="flex items-center">
            <span class="rounded-full w-8 h-8 flex items-center justify-center bg-surface-100 dark:bg-surface-700">
              <i class="pi text-lg" [ngClass]="item.icon"></i>
            </span>
            <div class="ml-2"><p class="font-semibold text-sm mt-0 mb-1">{{ item.label! | translate }}</p>
              <p class="font-normal text-xs text-surface-600 dark:text-surface-200 mt-0 mb-0">{{ item['description'] | translate }}</p>
            </div>
          </div>
        </article>
      }
    </div>
    <div
      class="h-full py-2 px-4 flex flex-col relative flex-auto border-l border-surface ml-2 overflow-hidden">
      <div class="min-h-0 overflow-y-auto flex-auto">
        <ng-container [ngComponentOutlet]="activeMenuItem['component']"></ng-container>
      </div>
    </div>
  </div>
</p-dialog>
