<span class="p-text-secondary block mb-8">Update your information.</span>
<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="flex items-center gap-4 mb-4">
    <label for="name" class="font-semibold w-24">{{
      'name' | translate
    }}</label>
    <p-autoComplete
      formControlName="name"
      inputId="name"
      id="name"
      [emptyMessage]="'no_results' | translate"
      [suggestions]="filteredItems"
      appendTo="body"
      (completeMethod)="filterItems($event)"
    >
      <ng-template let-item pTemplate="selectedItem">
        <span>{{ item | translate | titlecase }}</span>
      </ng-template>
      <ng-template let-item pTemplate="item">
        <span>{{ item | translate | titlecase }}</span>
      </ng-template>
    </p-autoComplete>
  </div>
  <div class="flex items-center gap-4 mb-8">
    <label for="price" class="font-semibold w-24">{{
      'price' | translate
    }}</label>
    <p-inputNumber
      formControlName="price"
      id="price"
      class="flex-auto"
      mode="decimal"
      [minFractionDigits]="2"
      [maxFractionDigits]="5"
      placeholder="5000"
    />
  </div>
  <div class="flex justify-end gap-2">
    <p-button
      label="Cancel"
      severity="secondary"
      (onClick)="cancelAddProduct.emit()"
    />
    <p-button type="submit" label="Save" [disabled]="form.invalid" />
  </div>
</form>
