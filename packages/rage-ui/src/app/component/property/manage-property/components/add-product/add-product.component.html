<span class="p-text-secondary block mb-5">Update your information.</span>
<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="flex align-items-center gap-3 mb-3">
    <label for="name" class="font-semibold w-6rem">{{ 'name' | translate }}</label>
    <p-autoComplete
      formControlName="name"
      inputId="name"
      id="name"
      [suggestions]="availableItems"
      (completeMethod)="filterItems($event)">
      <ng-template let-item pTemplate="selectedItem">
        <span>{{ item | translate }}</span>
      </ng-template>
      <ng-template let-item pTemplate="item">
        <span>{{ item | translate }}</span>
      </ng-template>
    </p-autoComplete>
  </div>
  <div class="flex align-items-center gap-3 mb-5">
    <label for="price" class="font-semibold w-6rem">{{ 'price' | translate }}</label>
    <p-inputNumber formControlName="price" id="price" class="flex-auto" mode="decimal" [minFractionDigits]="2"
                   [maxFractionDigits]="5"
                   placeholder="5000" />
  </div>
  <div class="flex justify-content-end gap-2">
    <p-button label="Cancel" severity="secondary" (onClick)="cancelAddProduct.emit()" />
    <p-button type="submit" label="Save" />
  </div>
</form>
