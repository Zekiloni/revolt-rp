@if (form) {
<form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-12 gap-4 formgrid p-fluid">
  <div class="field col-span-12 md:col-span-6">
    <label for="name" class="text-surface-500 dark:text-surface-300">{{ 'name' | translate }}</label>
    <input
      pInputText
      id="name"
      formControlName="name"
      type="text"
      class="w-full"
    />
  </div>

  <div class="col-span-12">
    <button
      pButton
      type="submit"
      [label]="'save' | translate"
      class="w-60"
      [disabled]="!anyChanges"
    ></button>
  </div>
</form>
}

<div class="mt-2">
  <app-manage-interaction-points [property]="property" />
</div>
