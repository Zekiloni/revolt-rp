@if (form) {
  <form [formGroup]="form" (ngSubmit)="submit()" class="grid formgrid p-fluid">
    <div class="field col-12 md:col-6">
      <label for="name" class="text-500">{{ 'name' | translate }}</label>
      <input pInputText id="name" formControlName="name" type="text" class="w-full" />
    </div>

    <div class="col-12">
      <button pButton type="submit" [label]="'save' | translate" class="w-15rem" [disabled]="!anyChanges"></button>
    </div>
  </form>
}



<div class="mt-2">
  <app-manage-interaction-points [property]="property" />
</div>
