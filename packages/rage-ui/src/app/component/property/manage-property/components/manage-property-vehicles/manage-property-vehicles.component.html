<p-table [value]="vehicles" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>{{ 'vehicle_model' | translate}}</th>
      <th>{{ 'vehicle_limit' | translate }}</th>
      <th>{{ 'vehicle_bodyHealth' | translate}}</th>
      <th>{{ 'vehicle_color' | translate}}</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-vehicle>
    <tr>
      <td>{{ vehicle.model }}</td>
      <td>{{ vehicle.limit }}</td>
      <td>{{ vehicle.bodyHealth }}</td>
      <td>Boja</td>
    </tr>
  </ng-template>
</p-table>
