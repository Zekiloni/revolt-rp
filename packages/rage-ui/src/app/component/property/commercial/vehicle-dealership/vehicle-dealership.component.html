<p-dialog
  [header]="title"
  [draggable]="false"
  [(visible)]="isActive"
  (onHide)="close()"
  position="bottom">
  <div class="flex align-items-center gap-3 mb-5">
    <p-carousel
      [value]="catalog"
      [numVisible]="1"
      [numScroll]="1"
      [style]="{ maxWidth: '750px' }"
      orientation="horizontal"
      (onPage)="onCatalogPage($event)">
      <ng-template let-vehicle pTemplate="item">
        <div class="border-1 surface-border border-round m-2 p-3">
          <div class="mb-3 font-medium">
            {{ vehicle['name'] | titlecase }}
          </div>
          @if (showInfo) {
            <app-vehicle-stats [model]="vehicle['name']" />
          }
          <div class="flex justify-content-between align-items-center">
            <div class="mt-0 font-semibold text-green-500 text-xl">
              <span>{{ vehicle['price'] | currency }}</span>
            </div>
            <span>
              <p-button icon="pi pi-info-circle" severity="secondary" [outlined]="true" [rounded]="true"
                        (onClick)="showInfo = !showInfo" />
            </span>
          </div>
        </div>
      </ng-template>
    </p-carousel>
  </div>
  <div class="flex justify-content-end gap-2">
    <p-button label="{{ 'cancel' | translate }}" severity="secondary" (onClick)="isActive = false" />
    <p-button icon="pi pi-shopping-cart" label="{{ 'select' | translate }}" (onClick)="checkout()" />
  </div>
</p-dialog>
