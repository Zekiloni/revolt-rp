<p-dialog
  [header]="title"
  [modal]="false"
  [maximizable]="true"
  [(visible)]="isActive"
  (onHide)="close()"
  position="right"
  [style]="{ width: '25rem' }">

  {{ pedModel }}
  @if (property) {
    @for (product of products; let i = $index; track i) {
      <button pButton label="{{ product.name | translate }}"
              (click)="selectCategory(product)"></button>
    }

    @if (selectedComponentId !== null) {
      {{ componentVariations[selectedComponentId].length }}

      <div class="grid">
        @for (item of pageItems; let index = $index; track item) {
          <div
            class="col-12 md:col-4 flex align-items-center p-2"
            [ngClass]="{ 'surface-ground' : index % 2 }">
            <p-image
              [src]="getClothingImage(selectedComponentId, item['drawableId'], item['textureId']) | staticAsset"
              alt="Image"
              loading="lazy"
              (click)="previewClothing(selectedComponentId, item['drawableId'], item['textureId'])"
              width="150" />

<!--            {{ selectedComponentId }} / {{ item['drawableId'] }} / {{ item['textureId'] }}-->
          </div>
        }
      </div>


      <div class="flex-auto mt-3">
        <p-paginator
          (onPageChange)="onPageChange($event)"
          [first]="pageIndex"
          [rows]="pageSize"
          dropdownAppendTo="body"
          [totalRecords]="componentVariations[selectedComponentId].length"
          [rowsPerPageOptions]="[10, 20, 30]" />
      </div>
    }
  }
