<p-dialog [header]="'create_property' | translate" [modal]="true" [(visible)]="isActive"
          (onHide)="close()"
          [style]="{ width: '30rem' }" [draggable]="false">

  <form class="grid grid-cols-12 gap-4 formgrid p-fluid" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field mb-6 col-span-8">
      <label for="name" class="mb-2">{{ 'name' | translate }} <small>({{ 'optional' | translate }})</small></label>
      <input id="name" type="text" pInputText formControlName="name" placeholder="Inglewood 24/7 Market" />
    </div>

    <div class="field mb-6 col-span-4">
      <label for="price" class="mb-2">{{ 'price' | translate }}
        <small>({{ (isPurchasableType ? 'required' : 'optional') | translate }})</small>
      </label>
      <p-inputNumber formControlName="price" id="price" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="5"
                     placeholder="5000" />
    </div>

    <div class="field mb-6 col-span-12 md:col-span-6">
      <label for="type" class="mb-2">{{ 'property_type' | translate }}</label>
      <p-dropdown
        [options]="propertyTypes"
        formControlName="type"
        appendTo="body"
        [filter]="true"
        [emptyFilterMessage]="'no_results' | translate"
        [emptyMessage]="'no_results' | translate"
        [showClear]="true"
        id="type"
        [placeholder]="'select_type' | translate">
        <ng-template let-selectedItem pTemplate="selectedItem">
          <span>{{ selectedItem | translate }}</span>
        </ng-template>
        <ng-template let-type pTemplate="item">
          <span>{{ type | translate }}</span>
        </ng-template>
      </p-dropdown>
    </div>

    @if (propertySubTypes.length) {
      <div class="field mb-6 col-span-12 md:col-span-6">
        <label for="subType" class="mb-2">{{ 'sub_type' | translate }}</label>
        <p-dropdown
          [options]="propertySubTypes"
          formControlName="subType"
          appendTo="body"
          [filter]="true"
          [emptyFilterMessage]="'no_results' | translate"
          [emptyMessage]="'no_results' | translate"
          [showClear]="true"
          id="subType"
          [placeholder]="'select_type' | translate">
          <ng-template let-selectedItem pTemplate="selectedItem">
            <span>{{ selectedItem | translate }}</span>
          </ng-template>
          <ng-template let-type pTemplate="item">
            <span>{{ type | translate }}</span>
          </ng-template>
        </p-dropdown>
      </div>
    }

    <div class="field mb-6 col-span-12 md:col-span-6">
      <label for="parent-property" class="mb-2">{{ 'parent_property' | translate }}</label>
      <p-dropdown
        [options]="properties"
        formControlName="parentProperty"
        appendTo="body"
        [filter]="true"
        optionValue="id"
        optionLabel="name"
        [emptyFilterMessage]="'no_results' | translate"
        [emptyMessage]="'no_results' | translate"
        [showClear]="true"
        id="parent-property"
        [placeholder]="'select_parent_property' | translate">
      </p-dropdown>
    </div>

    <div class="flex w-full justify-between gap-2 mt-2">
      <button pButton type="button" class="w-full" [label]="'cancel' | translate" severity="secondary"
              (click)="close()"></button>
      <button pButton type="submit" icon="pi pi-save" class="w-full" [label]="'submit' | translate"></button>
    </div>
  </form>
</p-dialog>
