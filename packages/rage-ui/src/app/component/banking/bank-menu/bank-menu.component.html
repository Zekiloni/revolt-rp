<div class="absolute-center bg-surface-0 dark:bg-surface-900 p-6 shadow rounded-2xl w-full lg:w-4/12 md:w-5/12">
  <div class="border-b border-surface p-2">
    <article
      class="flex w-full justify-between items-center select-none cursor-pointer border-surface hover:bg-emphasis rounded-lg px-2 py-1 text-surface-800 dark:text-surface-50 hover:text-primary"
      (click)="createSavingAccount()">
      <div class="flex items-center">
        <span class="rounded-full w-8 h-8 flex items-center justify-center bg-surface-100 dark:bg-surface-700">
        <i class="pi pi-plus text-lg"></i>
      </span>
        <div class="ml-2 p-2">
          <p class="font-semibold text-sm mt-0 mb-1">{{ 'bank_menu.open_savings_account' | translate }}</p>
          <p class="font-normal text-xs text-surface-600 dark:text-surface-200 mt-0 mb-0">{{ 'bank_menu.savings_account_desc' | translate }}</p>
        </div>
      </div>
    </article>

    <article
      class="flex w-full justify-between items-center select-none cursor-pointer border-surface hover:bg-emphasis rounded-lg px-2 py-1 text-surface-800 dark:text-surface-50 hover:text-primary"
      (click)="manageBankAccounts()">
      <div class="flex items-center">
        <span class="rounded-full w-8 h-8 flex items-center justify-center bg-surface-100 dark:bg-surface-700">
        <i class="pi pi-user text-lg"></i>
      </span>
        <div class="ml-2 p-2">
          <p class="font-semibold text-sm mt-0 mb-1">{{ 'bank_menu.my_accounts' | translate }}</p>
          <p class="font-normal text-xs text-surface-600 dark:text-surface-200 mt-0 mb-0">{{ 'bank_menu.my_account_desc' | translate }}</p>
        </div>
      </div>
    </article>

  </div>
  <div class="p-2">
    <article
      class="flex w-full justify-between items-center select-none cursor-pointer border-surface hover:bg-emphasis rounded-lg px-2 py-1 text-surface-800 dark:text-surface-50 hover:text-primary"
      (click)="closeMenu()">
      <div class="flex items-center">
        <span class="rounded-full w-8 h-8 flex items-center justify-center bg-surface-100 dark:bg-surface-700">
          <i class="pi pi-sign-out text-lg"></i>
        </span>
        <div class="ml-2 p-2">
          <p class="font-semibold text-sm mt-0 mb-1">{{ 'bank_menu.close_menu' | translate }}</p>
          <p class="font-normal text-xs text-surface-600 dark:text-surface-200 mt-0 mb-0">{{ 'bank_menu.end_session' | translate }}</p>
        </div>
      </div>
    </article>
  </div>
</div>
