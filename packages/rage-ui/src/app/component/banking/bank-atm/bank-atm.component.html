<div class="absolute-center bg-surface-0 dark:bg-surface-900 p-6 shadow rounded-border w-full lg:w-3/12 md:w-4/12">
  @if (bankAccount) {
    <div class="flex flex-col gap-4" @fadeInOut>
      <div class="flex justify-between border-b border-surface p-4">
        <span class="font-semibold  text-xl">{{ 'balance' | translate }}</span>
        <span class="text-green-500 text-2xl font-bold">{{ bankAccount.balance | currency }}</span>
      </div>

      <button pButton severity="primary" icon="pi pi-minus-circle" [label]="'withdraw' | translate"
              (click)="makeAction(BankActionType.Withdraw)"></button>
      <button pButton severity="primary" icon="pi pi-plus-circle" [outlined]="true"
              [label]="'deposit' | translate" (click)="makeAction(BankActionType.Deposit)"></button>
      <button pButton severity="danger" icon="pi pi-times" [text]="true" [label]="'cancel' | translate"
              (click)="closeAtm()"></button>
    </div>
  } @else {
    <div class="flex flex-col items-center">
      <div class="font-bold text-xl mb-2">{{ 'authenticate' | translate }}</div>
      <p class="text-muted-color block mb-8">{{ 'input_pin_code_hint' | translate }}</p>

      <p-inputOtp [(ngModel)]="pinCodeInput" [length]="4" size="large" [mask]="true" [invalid]="pinInvalid" />

      <div class="flex justify-between mt-8 gap-8">
        <p-button [label]="'cancel' | translate" icon="pi pi-times" severity="danger" [outlined]="true"
                  (click)="closeAtm()"
                  class="p-0" />
        <p-button [label]="'clear' | translate" [link]="true" (click)="this.pinCodeInput = null" class="p-0" />
        <p-button [label]="'submit' | translate" icon="pi pi-sign-in" (click)="submitAuthentication()"
                  [disabled]="!isValidPin" />
      </div>
    </div>
  }
</div>
