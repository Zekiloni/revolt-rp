name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
   build:
     runs-on: ubuntu-latest

     steps:
     - name: Checkout code
       uses: actions/checkout@v2

     - name: Set up Node.js
       uses: actions/setup-node@v2
       with:
         node-version: '16'

     - name: Install dependencies
       run: npm install

     - name: Build server
       run: nx run rage-server:build

     - name: Build client
       run: nx run rage-client:build

     - name: Set up Docker Build
       uses: docker/setup-buildx-action@v1

     - name: Login to DockerHub
       uses: docker/login-action@v2
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Build and push Docker image
       uses: docker/build-push-action@v2
       with:
         context: .
         push: true
         tags: zekiloni2/bcrp_ragemp:latest

   deploy:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to VPS
          uses: appleboy/ssh-action@master
          id: ssh_test
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USERNAME }}
            key: ${{ secrets.SERVER_KEY }}
            debug: true
            script: whoami

        - name: Deploy to VPS
          if: failure()
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USERNAME }}
            key: ${{ secrets.SERVER_KEY }}
            debug: true
            script: |
              echo "Running commands on VPS"
              docker pull zekiloni2/bcrp_ragemp:latest
              docker stop ragemp_server || true
              docker rm ragemp_server || true
              docker run -d --name ragemp_server-p 22005:22005/udp -p 22006:22006/tcp zekiloni2/bcrp_ragemp:latest
              echo "Deployment finished."
