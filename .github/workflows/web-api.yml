name: Web API CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'packages/web-api/**'
  pull_request:
    branches:
      - master
    paths:
      - 'packages/web-api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/web-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build RAGE:Server
        run: npx nx run web-api:build

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}
          registry: ghcr.io

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/web-api

    needs: build

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          debug: true
          timeout: 60s
          known_hosts: |
            ${{ secrets.KNOWN_HOSTS }}
          script: |
            echo "Running commands on VPS"
            echo "${{ secrets.GHCR_ACCESS_TOKEN }}" | docker login ghcr.io --username ${{ github.actor }} --password-stdin

            docker stop web_api || true
            docker rm web_api || true

            docker images "${{ env.IMAGE_NAME }}" -q | xargs -I {} docker rmi -f {}
            docker pull ${{ env.IMAGE_NAME }}:latest

            docker run -d --name web_api \
            -p 3000:3000 \
            "${{ env.IMAGE_NAME }}:latest"
