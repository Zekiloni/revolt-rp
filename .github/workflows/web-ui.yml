name: Web API CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'packages/web-ui/**'
  pull_request:
    branches:
      - master
    paths:
      - 'packages/web-ui/**'
  workflow_dispatch: # This is for manual triggering of the workflow

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/zekiloni/revolt-rp/web-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build WEB:API
        run: npx nx run web-ui:build

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}
          registry: ghcr.io

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web-ui/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
