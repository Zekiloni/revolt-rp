name: Discord BOT:MP CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'packages/discord-bot/**'
  pull_request:
    branches:
      - master
    paths:
      - 'packages/discord-bot/**'
  workflow_dispatch: # This is for manual triggering of the workflow

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/zekiloni/revolt-rp/discord-bot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build DISCORD-BOT
        run: npx nx run discord-bot:build

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}
          registry: ghcr.io

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/discord-bot/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/zekiloni/revolt-rp/discord-bot
    needs: build
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          debug: true
          timeout: 60s
          known_hosts: |
            ${{ secrets.KNOWN_HOSTS }}
          script: |
            echo "Running commands on VPS"
            echo "${{ secrets.GHCR_ACCESS_TOKEN }}" | docker login ghcr.io --username ${{ github.actor }} --password-stdin

            docker stop discord_bot || true
            docker rm discord_bot || true

            docker images "${{ env.IMAGE_NAME }}" -q | xargs -I {} docker rmi -f {}
            docker pull ${{ env.IMAGE_NAME }}:latest

            docker run -d --name discord_bot \
            -p 3000:3000 \
            "${{ env.IMAGE_NAME }}:latest"

